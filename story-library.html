<!--
ASSUMPTIONS｜用户已选定「2+3」，本文件把方向2的目录检索与方向3的版本档案、低干扰阅读合成一个四视图产品。
- 平台定位为普及教育、让大众了解传统文化的数据库平台，免费供大众及教育使用；这是本地交互原型，8部作品均为候选资源，所有简介均标为“原型编辑概述”。
- 可合法发现的资源先建立并公开基础目录与合法来源链接；正文、插画、音频等具体内容仍逐项评审后公开，可发现不等于可复制或可公开。
- 现实版本、出版、来源链接与使用条件没有证据时不伪造，公开状态标为“待评审”；“100条”只指首批目录建设目标，不是已公开内容数量。
- 遵循 docs/PROJECT_PRINCIPLES.md「先研究采集，再判断使用」：Research（研究资源库）与 Library（儿童阅读与使用层）分开，每条记录保留 research_status / rights_status / quality_status / access_method / publication_status 五类状态。
- 全文篇章填充：正文默认录入完整篇章、全卷或全书，不用节选、梗概、导读或原创整理稿冒充正文；对权利未明的现代作品只登记研究线索与原始来源链接，不复制第三方正文。
- 7部作品已录入完整篇章/全卷/全书（含《览冥训》全篇、《北山经》三节全篇、《搜神后记·卷五》全卷、《五蠹》全篇及英文原作全书/全篇）；《稻草人》按研究层登记，公开层全文待权利评审。
- 阅读器默认展示典籍原文全篇、公版英文原作或公版历史英译，原创中文整理稿仅作辅助；原文与辅助稿分别保存阅读进度，收藏和字号写入当前浏览器 localStorage v4，不上传、不模拟云同步。
- 无外部运行依赖、字体、CDN或网络图片；封面与内容地图分别原样取自 docs/assets/story-library-cover.svg 和 story-library-content-map.svg，封面以 data URI、内容地图以内联 SVG 使用。

FORM 来自内容哪里
- 目录的检索台、错位书封与馆藏签来自 prototype-spec.md 对“发现”的角色定义及方向2；首屏直接搜索，不做营销 Hero。
- 档案的摊开双页、版本 Tab 与窄旁注来自 STORY_LIBRARY_PLAN_V1 第4章“作品、文本、插画、朗读分别建档”及方向3。
- 阅读器收敛装饰，以30em版心、1.9行高、三档字号与显式进度服务连续阅读；书架只承担回访与管理。
- 暖纸、灰绿、墨色、朱砂与藤黄来自 design-spec.md / brand-spec.md；系统字体栈遵循项目规范。
-->

  originalSections:[{"title":"《淮南子·览冥训》全篇","paragraphs":["昔者师旷奏白雪之音，而神物为之下降，风雨暴至，平公癃病，晋国赤地。庶女叫天，雷电下击，景公台陨，支体伤折，海水大出。夫瞽师、庶女，位贱尚葈，权轻飞羽，然而专精厉意，委务积神，上通九天，激励至精。由此观之，上天之诛也，虽在圹虚幽闲，辽远隐匿，重袭石室，界障险阴，其无所逃之亦明矣。","武王伐纣，渡于孟津，阳侯之波，逆流而击，疾风晦冥，人马不相见。于是武王左操黄钺，右秉白旄，瞋目而撝之曰： 余任天下，谁敢害吾意者！ 于是风济而波罢。鲁阳公与韩搆难，战酣日暮，援戈而撝之，日为之反三舍。夫全性保真，不亏其身，遭急迫难，精通于天，若乃未始出其宗者，何为而不成？夫死生同域，不可胁陵，勇武一人，为三军雄。彼直求名耳，而能自要者尚犹若此，又况夫宫天地、怀万物而友造化，含至和，直偶于人形，观九钻一，知之所不知，而心未尝死者乎！","昔雍门子以哭见于孟尝君，已而陈辞通意，抚心发声，孟尝君为之增欷歍唈，流涕狼戾不可止。精神形于内而外谕哀于人心，此不传之道。使俗人不得其君形者而效其容，必为人笑。故蒲且子之连鸟于百仞之上，而詹何之鹜鱼于大渊之中，此皆得清净之道、太浩之和也。","夫物类之相应，玄妙深微，知不能论，辩不能解。故东风至而酒湛溢，蚕咡丝而商弦绝，或感之也。画随灰而月运阙，鲸鱼死而彗星出，或动之也。","故圣人在位，怀道而不言，泽及万民。君臣乖心，则背谲见于天，神气相应，征矣。故山云草莽，水云鱼鳞，旱云烟火，涔云波水，各象其形类，所以感之。夫阳燧取火于日，方诸取露于月。天地之间，巧历不能举其数；手征忽怳，不能览其光。然以掌握之中，引类于太极之上，而水火可立致者，阴阳同气相动敢，此傅说之所以骑辰尾也。","故至阴飂飂，至阳赫赫，两者交接成和而万物生焉。众雄而无雌，又何化之所能造乎？所谓不言之辩，不道之道也。故召远者使无为焉，亲近者使无事焉，惟夜行者为能有之。故却走马以粪，而车轨不接于远方之外，是谓坐驰陆沈，昼冥宵明，以冬铄胶，以夏造冰。","夫道者，无私就也，无私去也；能者有余，拙者不足；顺之者利，逆之者凶。譬如隋侯之珠，和氏之壁，得之者富，失之者贫；得失之度，深微窈冥，难以知论，不可以辩说也。何以知其然？今夫地黄主属骨，而甘草主生肉之药也，以其属骨，责其生肉，以其生肉，论其属骨，是犹王孙绰之欲倍偏枯之药而欲以生殊死之人，亦可谓失论矣。若夫以火能焦木也，因使销金，则道行矣。若以慈石之能连铁也，而求其引瓦，则难矣。物固不可以轻重论也。","夫燧之取火于日，慈石之引铁，蟹之败漆，葵之向日，虽有明智，弗能然也。故耳目之察，不足以分物理；心意之论，不足以定是非。故以智力治者，难以持国，唯通于太和而持自然之应者，为能有之。故峣山崩而薄落之水涸，区冶生而淳钩之剑成；纣为无道，左强在侧；大公并世，故武王之功立。由是观之，利害之路，祸福之门，不可求而得也。","夫道之与德，若韦之与革，远之则迩，近之则远；不得其道，若观鲦鱼。故圣若镜，不将不迎，应而不藏，故万化而无伤。其得之乃失之，其失之非乃得之也。","今夫调弦者，叩宫宫应，弹角角动，此同声相和者也。夫有改调一弦，其于五音无所比，鼓之而二十五弦皆应，此未始异于声，而音之君已形也。故通于大和者，惛若纯醉而甘卧，以游其中，而不知其所由至也。纯温以沦，钝闷以终。若未始出其宗，是谓大通。","今夫赤螭、青虬之游冀州也，天清地定，毒兽不作，飞鸟不骇，入榛薄，食荐梅，嗜味含甘，步不出顷亩之区，而蛇鳝轻之，以为不能与之争于江海之中；若乃至于玄云之素朝，阴阳交争，降扶风，杂冻雨，扶摇而登之，威动天地，声震海内，蛇蟮著泥百仞之中，熊罴匍匐丘山磛岩，虎豹袭穴而不敢咆，猨狖颠蹶而失木枝，又况直蛇鳝之类乎！风皇之翔至德也，雷霆不作，风雨不兴，川谷不澹，草木不摇，而燕雀佼之，以为不能与之争于宇宙之间；还至其曾逝万仞之上，翱翔四海之外，过昆仑之疏圃，饮砥柱之湍濑，邅回蒙汜之诸，尚佯冀州之际，径蹑都广，人日抑节，羽翼弱水，暮宿风穴，当此之时，鸿鹄鸧鸖，莫不惮惊伏窜，注喙江裔，又况直燕雀之类乎！此明于小动之迹，而不知大节之所由者也。","昔者王良、造父之御也，上车摄辔，马为整齐而敛谐，投足调均，劳逸若一；心怡气和，体便轻毕；安劳乐进，驰鹜若灭；左右若鞭，周旋若环；世皆以为巧，然未见其贵者也。若夫钳且、大丙之御也，除辔衔，去鞭弃策，车莫动而自举，马莫使而自走也。日行月动，星耀而玄运，电奔而鬼腾；进退屈伸，不见朕垠，故不招指、不咄叱，过归雁于碣石，轶鶤鸡于姑余，骋若飞，鹜若绝；纵矢蹑风，追猋归忽；朝发博桑，日入落棠，此假弗用而能以成其用者也。非虑思之察、手爪之巧也。嗜欲形于胸中，而精神逾于六马，此以弗御御之者也。","昔者黄帝治天下，而力牧、太山稽辅之，以治日月之行律，治阴阳之气；节四时之度，正律历之数；别男女，异雌雄，明上下，等贵贱；使强不掩弱，众不暴寡；人民保命而不夭，岁时熟而不凶；百官正而无私，上下调而无尤；法令明而不暗，辅佐公而不阿；田者不侵畔，渔者不争限；道不拾遗，市不豫贾；城郭不关，邑无盗贼；鄙旅之人，相让以财；狗彘吐菽粟于路，而无忿争之心；于是日月精明，星辰不失其行；风雨时节，五谷登熟；虎狼不妄噬，鸷鸟不妄博；凤皇翔于庭，麒麟游于郊；青龙进驾，飞黄伏皁；诸北、儋耳之国，莫不献其贡职，然犹未及虑戏氏之道也。","往古之时，四极废，九州裂；天不兼覆，地不周载；火爁炎而不灭，水浩洋而不息；猛兽食颛民，鸷鸟攫老弱。于是女娲炼五色石以补苍天，断鳌足以立四极，杀黑龙以济冀州，积芦灰以止淫水。苍天补，四极正；淫水涸，冀州平；狡虫死，颛民生；背方州，抱圆天；和春阳夏，杀秋约冬，枕方寝绳；阴阳之所壅沈不通者，窍理之；逆气戾物、伤民厚积者，绝止之。当此之时，卧倨倨，兴眄眄；一自以为马，一自以为牛；其行蹎蹎，其视瞑瞑；侗然皆得其和，莫知所由生，浮游不知所求，魍魉不知所往。当此之时，禽兽蝮蛇，无不匿其爪牙，藏其螫毒，无有攫噬之心。考其功烈，上际九天，下契黄垆；名声被后世，光晖重万物。乘雷车，服驾应龙，骖青虬，援绝瑞，席萝图，黄云络，前白螭，后奔蛇，浮游消摇，道鬼神，登九天，朝帝于灵门，宓穆休于太祖之下。然而不彰其功，不扬其声，隐真人之道，以从天地之固然。何则？道德上通，而智故消灭也。","逮至夏桀之时，主暗晦而不明，道澜漫而不修；弃捐五帝之恩刑，推蹶三王之法籍；是以至德灭而不扬，帝道掩而不兴；举事戾苍天，发号逆四时；春秋缩其和，大地除其德；仁君处位而不安，大夫隐道而不言；群臣准上意而怀当，疏骨肉而自容；邪人参偶比周而阴谋，居君臣父子之间而况载；骄主而象其意，乱人以成其事。是故君臣乖而不亲，骨肉疏而不附；植社槁而裂，容台振而掩覆；犬群曝而入渊，豕衔藤而席澳；美人挐首墨面而不容，曼声吞炭内闭而不歌；丧不尽其哀，猎不听其乐；西老折胜，黄神啸吟；飞鸟铩翼，走兽废脚；山无峻干，泽无洼水；狐狸首穴，马牛放失；田无立禾，路无莎薠；金积折廉，壁袭无理；磬龟无腹，蓄策日施。","晚世之时，七国异族；诸侯制法，各殊习俗；纵横间之，举兵而相角；攻城滥杀，覆高危安；掘坟墓，扬人骸；大冲车，高重京；除战道，便死路；犯严敌，残不义；百往一反，名声苟盛也。是故质壮轻足者为甲卒千里之外，家老赢弱姜枪于内；厮徒马围，軵车奉饟，道路辽远，霜雪亟集，短褐不完，人赢车弊，泥涂至膝；相携于道，奋首于路，身枕格而死。所谓兼国有地者，伏尸数十万，破车以千百数，伤弓弩矛戟矢石之创者，扶举于路。故世至于枕人头，食人肉，葅人肝，饮人血，甘之于刍豢。","故自三代以后者，天下未尝得安其情性而乐其习俗，保其修命，天而不夭于人虐也。所以然者，何也？诸侯力征，天下不合而为一家。","逮至当今之时，天子在上位，持以道德，辅以仁义；近者献其智，远者怀其德；拱揖指麾，而四海宾服；春秋冬夏，皆献其贡职；天下混而为一，子孙相代，此五帝之所以迎天德也。","夫圣人者，不能生时，时至而弗失也。辅佐有能，黜谗佞之端，息巧辩之说；除刻削之法，去烦苛之事；屏流言之迹，塞朋党之门；消知能，修太常；隳肢体，继聪明；大通混冥，解意释神；漠然若无魂魄，使万物各复归其根；则是所修伏牺氏之迹而反五帝之道也。夫钳且、大丙不施辔衔，而以善御闻于天下；伏戏、女娲不设法度，而以至德遗于后世。何则？至虚无纯一，而不喋苛事也。","《周书》曰： 掩雉不得，更顺其风。 今若夫申、韩、商鞅之为治也，桲拔其根，芜弃其本，而不穷究其所由生，何以至此也？凿五刑，为刻削，乃背道德之本而争于锥刀之未，斩艾百姓，弹尽太半，而忻忻然常自以为治，是犹抱薪而救火，凿窦而出水。夫井植生梓而不容瓮，沟植生条而不容舟，不过三月必死。所以然者何也？皆狂生而无其本者也。河九折注于海而流不绝者，昆仑之输也。潦水不泄，瀇瀁极望，旬月不雨，则涸而枯泽，受瀷而无源者。譬若羿请不死之药于西王母，姮娥窃以奔月，怅然有丧，无以续之。何则？不知不死之药所由生也。是故乞火不若取燧，寄汲不若凿井。"]}],
  paragraphs:[
    "很久很久以前，天和地忽然失去了安稳。支撑天空的四角倾斜了，九州大地裂开深深的缝隙，日月星辰也像找不到原来的位置。人们抬头望见破损的苍穹，低头又看见道路被裂缝截断。",
    "山林里的烈火一团接一团，河水越过堤岸，淹过田地和村庄。凶猛的鸟兽被混乱赶出巢穴，人们扶着老人、抱着孩子往高处走，却很难找到一处可以安心歇脚的地方。",
    "女娲走过山河，看见这些景象，决心把天地一点点修补好。她拣来青、黄、赤、白、黑五色的石头，把它们堆在高处，燃起炉火，炼了许多日夜。石头慢慢化成明亮的石浆，映得云边也泛起彩光。",
    "她托起温热的石浆，先补天空最大的裂口，再补那些细细的缝。每一处都要放得平稳，接得密实。风从她的袖边吹过，炉火渐渐低下去，破碎的苍天终于重新合拢，云和雨也有了各自的去处。",
    "天空虽然补好了，大地仍旧摇晃。女娲找到巨鳌，断下它的四足，立在四方，替天地稳住边界。她又制服在冀州兴风作浪的黑龙，让被搅乱的水势慢慢平静下来。",
    "低洼处还积着四处漫流的水。女娲收集芦苇，烧成灰，把芦灰一层层积在水口。散乱的水流受到阻挡，退进河道；被淹没的土地慢慢露出来，泥泞中重新出现了可以行走的小路。",
    "天补好了，四方站稳了，泛滥的水退去了。人们回到田间，扶起倒下的木架，重新播下种子。鸟兽也各自归林。清晨，第一声鸟鸣穿过安静的山谷，孩子们终于能在门前晒着太阳吃一顿饭。",
    "这场灾难没有在一瞬间消失，天地是经过一次次炼石、支撑和疏导才恢复秩序的。后来，人们仰望彩霞时，便想起那五色石的光，也想起一双把破碎世界耐心修补好的手。"
  ],

  originalSections:[{"title":"北山经之首","paragraphs":["北山经之首，曰单狐之山，多机木，其上多华草。逢漨水出焉，而西流注于泑水，其中多芘石文石。","又北二百五十里，曰求如之山，其上多玉，无草木。滑水出焉，而西流注于诸𣬈之水。其中多滑鱼。其状如鱓，赤背，其音如梧，食之已疣。其中多水马，其状如马，文臂牛尾，其音如呼。","又北三百里，曰带山，其上多玉，其下多青碧。有兽焉，其状如马，一角有错，其名曰灌疏，可以辟火。有鸟焉，其状如乌，五采而赤文，名曰鵸鵌，是自为牝牡，食之不疽。彭水出焉，而西流注于芘湖之水，中多鯈鱼，其状如鸡而赤毛，三尾六足四首，其音如鹊，食之可以已忧。","又北四百里，曰谯明之山。谯水出焉，西流注于河。其中多何罗之鱼，一首而十身，其音如吠犬，食之已痈。有兽焉，其状如貆而赤毫，其音如榴榴，名曰孟槐，可以御凶。是山也，无草木，多青雄黄。","又北三百五十里，曰涿光之山。嚣水出焉，而西流注于河。其中多鳛鳛之鱼，其状如鹊而十翼，鳞皆在羽端，其音如鹊，可以御火，食之不瘅。其上多松柏，其下多棕橿，其兽多鹿霝羊，其鸟多蕃。","又北三百八十里，曰虢山，其上多漆，其下多桐椐。其阳多玉，其阴多铁。伊水出焉，西流注于河。其兽多橐驼，其鸟多窝，状如鼠而鸟翼，其音如羊，可以御兵。","又北四百里，至于虢山之尾，其上多玉而无石。鱼水出焉，西流注于河，其中多文贝。","又北二百里，曰丹熏之山，其上多樗柏，其草多韭韭，多丹获。熏水出焉，而西流注于棠水。有兽焉，其状如鼠，而菟首麋身，其音如獆犬，以其尾飞，名曰耳鼠，食之不䐆，又可以御百毒。","又北二百八十里，曰石者之山，其上无草木，多瑶碧。泚水出焉，西流注于河。有兽焉，其状如豹，而文题白身，名曰孟极，是善伏，其鸣自呼。","又北百一十里，曰边春之山，多葱、葵、韭、桃、李。杠水出焉，而西流注于泑泽。有兽焉，其状如禺而文身，善笑，见人则卧，名曰幽鴳，其鸣自呼。","又北二百里，曰蔓联之山，其上无草木，有兽焉，其状如禺而有鬣，牛尾、文臂、马蹏，见人则呼，名曰足訾，其鸣自呼。有鸟焉，群居而朋飞，其毛如雌雉，名曰，其鸣自呼，食之已风。","又北八百里，曰单张之山，其上无草木。有兽焉，其状如豹而长尾，人首而牛耳，一目，名曰诸犍，善吒，行则衔其尾。有鸟焉，其状如雉，而文首、白翼、黄足，名曰白鵺，食之已嗌痛，可以已痸。栎水出焉，在而南流注于杠水。","又北三百二十里，曰灌题之山，其上多樗柘，其下多流沙，多砥。有兽焉，其状如牛而白尾，其音如詨，名曰那父。有鸟焉，其状如雌雉而人面，见人则跃，名曰竦斯，其鸣自呼也。匠韩之水出焉，而西流注于泑泽，其中多磁石。","又北二百里，曰潘侯之山，其上多松柏，其下多榛楛，其阳多玉，其阴多铁。有兽焉，基状如牛，而四节生毛，或曰旄牛。边水出焉，而南流注于栎泽。","又北二百三十里，曰小咸之山，无草木，冬夏有雪。","北二百八十里，曰大咸之山，无草木，其下多玉。是山也，四方，不可以上。有蛇名曰长蛇，其毛如彘豪，其音如鼓柝。","又北三百二十里，曰敦薨之山，其上多棕枬，其下多茈草。敦薨之水出焉，而西流注于泑泽。出于昆仑之东北隅，实惟河原。其中多赤鲑，其兽多兕，旄牛，其鸟多柝鸠。","又北二百里，曰少咸之山，无草木，多青碧。有兽焉，其状如牛，而赤身、人面、马足，名曰窥窳，其音如婴儿，是食人。敦水出焉，东流注于雁门之水，其中多魳魳之鱼。食之杀人。","又北二百里，曰狱法之山。瀼泽之出焉，而东北流注于泰泽。其中多䲃鱼，其状如鲤而鸡足，食之已疣。有兽焉，其状如犬而人面，善投，见人则笑，其名山[犭军]，其行如风，见则天下大风。","又北二百里，曰北岳之山，多枳棘刚木。有兽焉，其状如牛，而四角、人、耳、彘耳，其名曰诸怀，基音如鸣雁，是食人。诸怀之水出焉，而西流注于嚣水，水中多鮨鱼，鱼身而犬首，其音如婴儿，食之已狂。","又北百八十里，曰浑夕之山，无草木，多铜玉。嚣水出焉，而西流注于海。有蛇一首两身，名曰肥遗，见则其国大旱。","又北五十里，曰北单之山，无草木，多葱韭。","又北百里，曰罴差之山，无草木，多马。","又北百八十里，曰北鲜之山，是多马，鲜水出焉，而西北流注于涂吾之水。","又北百七十里，曰堤山，多马。有兽焉，其状如豹而文首，名曰狕。堤水出焉，而东流注于泰泽，其中多龙龟。","凡北山经之首，自单狐之山至于堤山，凡二十五山，五千四百九十里，其神皆人面蛇身。其祠之，毛用一雄鸡彘瘗，吉玉用一珪，瘗而为不糈。其山北人，皆生食不火之物。"]},{"title":"北次二经","paragraphs":["北次二经之首，在河之东，其首枕汾，其名曰管涔之山。其上无木而多草，其下多玉。汾水出焉，而西流注于河。","又西二百五十里，曰少阳之山，其上多玉，其下多赤银。酸水出焉，而东流注于汾水，其中多美赭。","又北五十里，曰县雍之山，其上多玉，其下多铜，其兽多闾麋，其鸟多白翟白[有鸟]。晋水出焉，而东南流注于汾水。其中多鮆鱼，其状如鯈而赤麟，其音如叱，食之不骄。","又北二百里，曰狐岐之山，无草木，多青碧。胜水出焉，而东北流注于汾水，其中多苍玉。","又北三百五十里，曰白沙山，广员三百里，尽沙也，无草木鸟兽。鲔水出于其上，潜于其下，是多白玉。","又北四百里，曰尔是之山，无草木，无水。","又北三百八十里，曰狂山，无草木，是山也，冬夏有雪。狂水出焉，而西流注于浮水，其中多美玉。","又北三百八十里，曰诸余之山，其上多铜玉，其下多松柏。诸余之水出焉，而东流注于旄水。","又北三百五十里，曰敦头之山，其上多金玉，无草木。旄水出焉，而东流注于印泽。其中多[马孛]马，牛尾而白身，一角，其音如呼。","又北三百五十里，曰钩吾之山，其上多玉，其下多铜。有兽焉，其状如羊身人面，其目在腋下，虎齿人爪，其音如婴儿，名曰狍鸮，是食人。","又北三百里，曰北嚻之山，无石，其阳多玉。有兽焉，其状如虎，而白身犬首，马尾彘鬣，名曰独𤞞。有鸟焉，其状如乌，人面，名曰𪄀𪃑，宵飞而昼伏，食之已暍。涔水出焉，而东流注于邛泽。","又北三百五十里，曰梁渠之山，无草木，多金玉。修水出焉，而东流注于雁门，其兽多居暨，其状如汇而赤毛，其音如豚。有鸟焉，其状如夸父，四翼、一目、犬尾，名曰嚣，其音如鹊，食之已腹痛，可以止衕。","又北四百里，曰姑灌之山，无草木。是山也，科夏有雪。","又北三百八十里，曰湖灌之山，其阳多玉，其阴多碧，多马，湖灌之水出焉，而东流注于海，其中多䱇。有木器厂焉，其叶如柳而赤理。","又北水行五百里，流沙三百里，至于洹山，其上多金玉。三桑生之，其树皆无枝，其高百仞。百果树生之。其下多怪蛇。","又北三百里，曰敦题之山，无草木，多金玉。是錞于北海。","凡北次二经之首，自管涔之山至于敦题之山，凡十七山，五千六百九十里。其神皆蛇身人面。其祠；毛用一雄鸡彘瘗；用一璧一珪，投而不糈。"]},{"title":"北次三经","paragraphs":["北次三经之首，曰太行之山。其首曰归山，其上有金玉，其下有碧。有兽焉，其状如麢羊而四角，马尾而有距，其名曰[马军]，善还，其名自詨有鸟焉，其状台鹊，白身、赤尾、六足，其名曰䴅，是善惊，其鸣自詨。","又东北二百里，曰龙侯之山，无草木，多金玉。决决之水出焉，而东流注于河。其中多人鱼，其状如䱱鱼，四足，其音如婴儿，食之无痴疾。","又东北二百里，曰马成之山，其上多文石，其阴多金玉。有兽焉，其状如白犬而黑头，见人则飞，其名曰天马，其鸣自詨，有鸟焉，其状如乌，首白而身青、足黄，是名曰鶌鶋。其名自詨，食之不饥，可以已寓。","又东北七十里，曰咸山，其上有玉，其下多铜，是多松柏，草多茈草。条菅之水出焉，而西南流注于长泽。其中多器酸，三岁一成，食之已疠。","又东北二百里，曰天池之山，其上无草木，多文石。有兽焉，其状如兔而鼠首，以其背飞，其名曰飞鼠。渑水出焉，潜于其下，其中多黄垩。","又东三百里，曰阳山，其上多玉，其下多金铜。有兽焉，其状如牛而尾，其颈肾，其状如句瞿，其名曰领胡，其鸣自詨，食之已狂。有鸟焉，其状如赤雉，而五采以文，是自为牝牡，名曰象蛇，其名自詨。留水出焉，而南流注于河。其中有䱤父之鱼，其状如鲋鱼，鱼首而彘身，食之已呕。","又东三百五十里，曰贲闻之山，其上多苍玉，其下多黄垩，多涅石。","又北百里，曰王屋之山，是多石。𣾍水出焉，而西北流注于泰泽。","又东北三百里，曰教山，其上多玉而无石。教水出焉，西流注于河，是水冬干而夏流，实惟干河。其中有两山。是山也，广员三百步，其名曰发丸之山，其上有金玉。","又南三百里，曰景山，南望盐贩之泽，北望少泽。其上多草、藷藇，其草多秦椒，其阴多赭，其阳多玉。有鸟焉，其状如蛇，而四翼、六目、六足，名曰酸与，其鸣自詨，见则其邑有恐。","又东南三百二十里，曰孟门之山，其上多苍玉，多金，其下多黄垩，多涅石。","又东南三百二十里，曰平山。平水出于其上，潜于其下，是多美玉。","又东二百里，曰京山，有美玉，多漆木，多竹，其阳有赤铜，其阴有玄䃤。高水出焉，南流注于河。","又东二百里，曰虫尾之山，其上多金玉，其下多竹，多青碧。丹水出焉，南流注于河；薄水出焉，而东南流注于黄泽。","又东三百里，曰彭𣬈之山，其上无草木，多金玉，其下多水。蚤林之水出焉，东南流注于河。肥水出焉，而南流注于床水，其中多肥遗之蛇。","又东百八十里，曰小侯之山。明漳之水出焉，南流注于黄泽。有鸟焉，其状如乌而白文，名曰鸪𪄶，食之不灂。","又东三百七十里，曰泰头之山。共水出焉，南流注于池。其上多金玉，其下多竹箭。","又东北二百里，曰轩辕之山，其上多铜，其下多竹。有鸟焉，其状如枭白首，其名曰黄鸟，其鸣自詨，食之不妒。","又北二百里，曰谒戾之山，其上多松柏，有金玉。沁水出焉，南流注于河。其东有林焉，名曰丹林。丹林之水出焉，南流注于河。婴侯之水出焉，北流注于汜水。","东三百里，曰沮洳之山，无草木，有金玉。濝水出焉，南流注于河。","又北三百里，曰神囷之山，具上有文石，其下有白蛇，有飞虫。黄水出焉，而东流注于洹；滏水出焉，而东流注于欧水。","又北二百里，曰发鸠之山，其上多柘木。有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自詨。是炎帝之少女名曰女娃，女娃游于东海，溺而不返，故为精卫。常衔西山之木石，以堙于东海。漳水出焉，东流注于河。","又东北百二十里，曰少山，其上有金玉，其下有铜。清漳之水出焉，东流注于浊漳之水。","又东北二百里，曰锡山，其上多玉，其下有砥。牛首之水出焉，而东流注于滏水。","又北二百里，曰景山，有美玉。景水出焉，东南流注于海泽。","又北百里，曰题首之山，有玉焉，多石，无水。","又北百里，曰绣山，其上有玉、青碧，其木多栒，其草多芍药、芎藭。洧水出焉，而东流注于河，其中有鳠、黾。","又北百二十里，曰松山。阳水出焉，东北流注于河。","又北百二十里，曰敦与之山，其上无草木，有金玉。溹水出于其阳，而东流注于泰陆之水；泜水出于其阴，而东流注于彭水；槐水出焉，而东流注于泜泽。","又北百七十里，曰柘山，其阳有金玉，其阴有铁。历聚之水出焉，而北流注于洧水。","又北二百里，曰维龙之山，其上有碧玉，其阳有金，其阴有铁。肥水出焉，而东流注于皋泽，其中多礨石。敞铁之水出焉，而北于大泽。","又北百八十里，曰白马之山，其阳多石玉，其阴多铁，多赤铜。木马之水了出焉，而东北流注于虖沱。","又北二百里，曰空桑之山，无草木，冬夏有雪。空桑空桑之水出焉，东流注于虖沱。","又北三百里，曰泰戏之山，无草木，多金玉。有兽焉，其状如羊，一角一目，目在耳后，其名曰䍶䍶，其鸣自訆。虖沱之水出焉，而东流注于溇水。液女之水出于其阳，南流注于沁水。","又北三百里，曰石山，多藏金玉。濩濩之水出焉，而东流注于虖沱；鲜于之水出焉，而南流注于虖沱。","又北二百里，曰童戎之山。皋涂之水出焉，而东流注于溇液水。","又北三百里，曰高是之山。滋水出焉，而南流注于虖沱。其木多棕，其草多条。滱水出焉，东流注于河。","又北三百里，曰陆山，多美玉。[姜阝]水出焉，而东流注于河。","又北二百里，曰沂山般水出焉，而东流注于河。","北百二十里，曰燕山，多婴石。燕水出焉，东流注于河。","又北山行五百里，水行五百里，至于饶山。是无草木，多瑶碧，其兽多橐駞，其鸟多鹠。历虢之水出焉，而东流注于河，其中有师鱼，食之杀人。","又北四百里，曰乾山，无草木，其阳有金玉，其阴有铁而无水。有兽焉，其状如牛而三足，其名曰獂，其鸣自詨。","又北五百里，曰伦山。伦水出焉，而东流注于河。有兽焉，其状如麋，其川在尾上，其名曰罴。","又北五百里，曰碣石之山。绳水出焉，而东流注于河，其中多蒲夷之鱼。基上有玉，其下多青碧。","又北水行五百里，至于雁门之山，无草木。","又北水行四百里，至于泰泽。其中有山焉，曰帝都之山，广员百里，无草木，有金玉。","又北五百里，曰錞于毋逢之山，北望鸡号之山，其风如䬅。西望幽都之山，浴水出焉。是有朋蛇，赤首白身，其音如牛，见则其邑大旱。","凡北次三经之首，自太行之山以至于无逢之山，凡四十六山，万二千三百五十里。其神状皆马身而人面者廿神。其祠之，皆用一藻茝瘗之。其十四神状皆彘身而载玉。其祠之，皆玉，不瘗。其十神状皆彘身而八足蛇尾。其祠之，皆用一壁瘗之。大凡四十四神，皆用稌糈米祠之。此皆不火食。","右北经之山志，凡八十七山，二万三千二百三十里。"]}],
  paragraphs:[
    "向北走过很远的路，有一座发鸠山，山上生着许多柘树。树林里常有一只鸟，羽毛像乌鸦，头上有花纹，嘴是白的，脚是红的。它飞过时，叫声像是在呼唤自己的名字：精卫。",
    "人们说，精卫从前是炎帝的小女儿，名叫女娃。她曾到东海边游玩，看潮水一遍遍涌上沙滩。有一天，海上风浪骤起，她不幸溺水，再也没有回到岸上。",
    "人们说，女娃没有再回到原来的生活，而是化为发鸠山上的精卫。它带着那片东海的记忆，在山林与海岸之间盘旋。清晨的雾还没有散，它已经落到西山的枝头，用白喙衔起一根细枝，或一颗小石子。",
    "从西山到东海，路很远。精卫掠过树梢、山坡和浅滩，翅膀迎着风，口中的木石始终不肯落下。到了海边，它把细枝或石子投下去，海面只泛起一圈很小的波纹。",
    "海那么宽，木石那么轻，浪花一卷，刚刚落下的东西就看不见了。精卫没有停在礁石上叹息，也没有说一句响亮的话。它转过身，又朝西山的方向飞去。",
    "潮来潮往，沙滩上的脚印会消失，海面上的波纹也会消失。精卫却一趟又一趟，把西山的一点木、一点石带到东海。红色的脚掠过水面，白色的喙在晨光里一闪，随后又成了远天的小点。",
    "故事没有说东海何时会被填平，只让那只鸟一直飞着。辽阔的大海和微小的木石放在一起，叫人记住的不是一次惊人的壮举，而是许多次普通却不肯停下的往返。"
  ],
  discussion:["精卫每一次衔来的木石都很小。你怎样理解这种看似微小、却不断重复的行动？","如果把故事中的一段往返画成三格画，你会选择哪三个画面？"]

  originalSections:[{"title":"清溪庙神","paragraphs":["晋太康中，谢家沙门竺昙遂，年二十馀，白皙端正，流俗沙门。尝行经清溪庙前过，因入庙中看。暮归，梦一妇人来，语云：“君当来作我庙中神，不复久。”昙遂梦问：“妇人是谁？”妇人云：“我是清溪庙中姑。”如此一月许，便病。临死，谓同学年少曰：“我无福，亦无大罪，死乃当作清溪庙神。诸君行，便可过看之。”既死后，诸年少道人诣其庙。既至，便灵语相劳问，声音如昔时。临去，云：“久不闻呗声，思一闻之。”其伴慧觐，便为作呗。讫，其神犹唱赞，语云：“岐路之诀，尚有凄怆；况此之乖，形神分散。窈冥之叹，情何可言？”既而歔欷不自胜，诸道人等皆为涕泣。"]},{"title":"王导子悦","paragraphs":["王导子悦，为中书郎。导梦人以百万钱买悦，导潜为祈祷者备矣。寻掘地，得钱百万，意甚恶之，一一皆藏闭。及悦疾笃，导忧念特至，积日不食。忽见一人，形状甚伟，被甲持刀。问：“是何人？”曰：“仆，蒋侯也。公儿不佳，欲为请命，故来尔。公勿复忧。”导因与之食，遂至数升。食毕，勃然谓导曰：“中书命尽，非可救也。”言讫不见。悦亦陨绝。"]},{"title":"吴望子","paragraphs":["汉，会稽鄮（编按：音懋。）县东野，有一女子，姓吴，字望子，年十六，姿容可爱。其乡里有鼓舞解事者，要之，便往。缘塘行，半路，忽见一贵人，端正非常。人乘船，手力十馀，皆整顿。令人问望子：“今欲何之？”其具以事对。贵人云：“我今正往彼，便可入船共去。”望子辞不敢。忽然不见。望子既到，跪拜神座，见两船中贵人，俨然端坐，即蒋侯像也。问望子：“来何迟？”因掷两橘与之。数数现形，遂隆情好。望子心有所欲，辄空中下之。曾思啖脍，一双鲜鲤，应心而至。望子芳香，流闻数里，颇有神验，一邑共奉事。经历三年，望子忽生外意，便绝往来。"]},{"title":"木像弯弓","paragraphs":["孙恩作逆时，吴兴分乱。一男子忽急，突入蒋侯庙。始入门，木像弯弓，射之，即卒。行人及守庙者，无不皆见。"]},{"title":"白头公","paragraphs":["晋太元中，乐安高衡为魏郡太守，戍石头。其孙雅之在厩中，云：“有神来降，自称白头公，拄杖，光辉照屋。与雅之轻举宵行，暮至京口，晨已来还。”后，雅之父子为桓玄所杀。"]},{"title":"临贺太守","paragraphs":["永和中，义兴人姓周，出都，乘马，从两人行。未至村，日暮。道边有一新草小屋，一女子出门，年可十六七，姿容端正，衣服鲜洁。望见周过，谓曰：“日已向暮，前村尚远。临贺讵得至？”周便求寄宿。此女为燃火作食。向一更中，闻外有小儿唤阿香声，女应：“诺。”寻云：“官唤汝推雷车。”女乃辞行，云：“今有事，当去。”夜遂大雷雨。向晓，女还。周既上马，看昨所宿处，止见一新冢，冢口有马尿及馀草。周甚惊惋。后五年，果作临贺太守。"]},{"title":"何参军女","paragraphs":["豫章人刘广，年少未婚。至田舍，见一女子云：“我是何参军女，年十四而夭，为西王母所养，使与下土人交。”广与之缠绵。其日，于席下得手巾，裹鸡舌香。其母取巾烧之，乃是火浣布。"]},{"title":"灵见","paragraphs":["桓大司马从南州还，拜简文皇帝陵。左右觉其有异。既登车，谓从者曰：“先帝向遂灵见。”既不述帝所言，故众莫之知。但见将拜时，频言“臣不敢”而已。又问左右殷涓形貌。有人答：“涓为人肥短黑色，甚丑。”桓云：“向亦见在帝侧，形亦如此。”意恶之。遂遇疾，未几而薨。"]},{"title":"白水素女","paragraphs":["晋安侯官人谢端，少丧父母，无有亲属，为邻人所养。至年十七八，恭谨自守，不履非法。始出居，未有妻，邻人共愍念之，规为娶妇，未得。端夜卧早起，躬耕力作，不舍昼夜。后于邑下得一大螺，如三升壶，以为异物，取以归，贮瓮中。畜之十数日。端每早至野，还，见其户中有饭饮汤火，如有人为者，端谓邻人为之惠也。数日如此，便往谢邻人。邻人曰：“吾初不为是，何见谢也？”端又以邻人不喻其意，然数尔如此，后更实问。邻人笑曰：“卿已自取妇，密著室中炊爨，而言吾为之炊耶？”端默然心疑，不知其故。后以鸡鸣出去，平早潜归，于篱外窃窥其家中。见一少女，从瓮中出，至灶下燃火。端便入门，迳至瓮所，视螺，但见壳。乃到灶下问之曰：“新妇从何所来，而相为炊？”女大惶惑，欲还瓮中，不能得去，答曰：“我天汉中白水素女也。天帝哀卿少孤，恭慎自守，故使我权相为守舍炊烹。十年之中，使卿居富得妇，自当还去。而卿无故窃相窥掩，吾形已见，不宜复留，当相委去。虽然，尔后自当少差。勤于田作、渔采、治生。留此壳去，以贮米谷，常可不乏。”端请留，终不肯。时天忽风雨，翕然而去。端为立神座，时节祭祀。居常饶足，不致大富耳。于是乡人以女妻之，后仕至令长云。今道中素女祠是也。"]}],
  paragraphs:[
    "从前，有个年轻人住在山脚，一间草屋挨着几分薄田。他每天天蒙蒙亮就下田，傍晚才扛着锄头回来。屋里只有一口小锅，农忙时，他常常随便煮一碗粥，吃完便坐在门槛上歇脚。",
    "一天，他在水田里拾到一只大田螺，壳色青亮，拿在手里沉甸甸的。年轻人没有把它下锅，而是带回家，放进清水缸，又拾了几根水草陪它。水缸摆在窗边，日光照进来，螺壳上像有一层细细的光。",
    "第二天傍晚，年轻人推门回家，忽然闻到饭菜的香气。桌上摆着热腾腾的米饭和两碟小菜，灶膛里的火还没有熄，地面也扫得干干净净。他站到门外看了看，山路上一个人影也没有。",
    "他先以为是邻居帮忙，挨家去道谢，大家都笑着摇头。接下来的几天，热饭仍会在他回家时准时出现。年轻人心里感激，也越发疑惑：是谁每天悄悄来，又不肯留下姓名呢？",
    "一个清晨，他照旧扛着锄头出门，走到半路又轻轻折回来。草屋的烟囱升起一缕细烟，门里传出淘米和添柴的声音。他没有猛推门，只从窗边的竹帘缝里静静望去。",
    "水缸旁站着一位陌生的姑娘，衣袖挽起，正把洗好的米倒进锅里。大田螺的空壳搁在清水边，水草轻轻晃动。姑娘听见脚步，回头看见年轻人，便告诉他：自己借居在田螺中，感念他拾螺后没有伤害，又日日换清水，所以来帮他料理几顿饭。",
    "年轻人听了，先向姑娘道谢，随后认真地说，当初养下田螺，并不是为了换谁来劳作。姑娘愿意帮忙，他心存感谢；姑娘若想回到水里，或去别的地方，也不必因为几顿饭而留下。",
    "姑娘安静地听完，笑着把一碗饭放到桌上。她说，自己愿意留下住一段日子，但不再躲起来做事。从那以后，两个人一起下田、种菜、收拾屋子，谁累了，另一个便多添一把柴。",
    "窗边的水缸一直留着清水，空螺壳也没有被丢掉。过路的人常看见草屋里亮着一盏小灯，桌边有两副碗筷。那段由一次拾螺开始的日子，不靠谁亏欠谁，只在一顿顿共同做好的饭菜里慢慢延续。"
  ],
  discussion:["年轻人知道姑娘的身份后，哪一句话最能体现他尊重姑娘的选择？","民间故事会随讲述者改变。如果这个姑娘有一天想去远方，你想象中的下一顿告别饭会是什么样子？"]

  originalSections:[{"title":"《韩非子·五蠹》全篇","paragraphs":["上古之世，人民少而禽兽众，人民不胜禽兽虫蛇。有圣人作，构木为巢以避群害，而民悦之，使王天下，号曰有巢氏。民食果蓏蚌蛤，腥臊恶臭而伤害腹胃，民多疾病。有圣人作，钻燧取火以化腥臊，而民说之，使王天下，号之曰燧人氏。中古之世，天下大水，而鲧、禹决渎。近古之世，桀、纣暴乱，而汤、武征伐。今有构木钻燧于夏后氏之世者，必为鲧、禹笑矣；有决渎于殷、周之世者，必为汤、武笑矣。然则今有美尧、舜、汤、武、禹之道于当今之世者，必为新圣笑矣。是以圣人不期修古，不法常可，论世之事，因为之备。宋有人耕田者，田中有株，兔走触株，折颈而死，因释其耒而守株，冀复得兔，兔不可复得，而身为宋国笑。今欲以先王之政，治当世之民，皆守株之类也。","古者丈夫不耕，草木之实足食也；妇人不织，禽兽之皮足衣也。不事力而养足，人民少而财有余，故民不争。是以厚赏不行，重罚不用，而民自治。今人有五子不为多，子又有五子，大父未死而有二十五孙。是以人民众而财寡，事力劳而供养薄，故民争，虽倍赏累罚而不免于乱。","尧之王天下也，茅茨不翦，采椽不斫；粝粢之食，藜藿之羹；冬日麑裘，夏日葛衣；虽监门之服养，不亏于此矣。禹之王天下也，身执耒臿以为民先，股无胈，胫不生毛，虽臣虏之劳，不苦于此矣。以是言之，夫古之让天子者，是去监门之养，而离臣虏之劳也，古传天下而不足多也。今之县令，一日身死，子孙累世絜驾，故人重之。是以人之于让也，轻辞古之天子，难去今之县令者，薄厚之实异也。夫山居而谷汲者，膢腊而相遗以水；泽居苦水者，买庸而决窦。故饥岁之春，幼弟不饷；穰岁之秋，疏客必食。非疏骨肉，爱过客，多少之实异也。是以古之易财，非仁也，财多也；今之争夺，非鄙也，财寡也。轻辞天子，非高也，势薄也；重争士橐，非下也，权重也。故圣人议多少、论薄厚为之政。故罚薄不为慈，诛严不为戾，称俗而行也。故事因于世，而备适于事。","古者文王处丰、镐之间，地方百里，行仁义而怀西戎，遂王天下。徐偃王处汉东，地方五百里，行仁义，割地而朝者三十有六国。荆文王恐其害己也，举兵伐徐，遂灭之。故文王行仁义而王天下，偃王行仁义而丧其国，是仁义用于古不用于今也。故曰：世异则事异。当舜之时，有苗不服，禹将伐之。舜曰： 不可。上德不厚而行武，非道也。 乃修教三年，执干戚舞，有苗乃服。共工之战，铁铦矩者及乎敌，铠甲不坚者伤乎体。是干戚用于古不用于今也。故曰：事异则备变。上古竞于道德，中世逐于智谋，当今争于气力。齐将攻鲁，鲁使子贡说之。齐人曰： 子言非不辩也，吾所欲者土地也，非斯言所谓也。 遂举兵伐鲁，去门十里以为界。故偃王仁义而徐亡，子贡辩智而鲁削。以是言之，夫仁义辩智，非所以持国也。去偃王之仁，息子贡之智，循徐、鲁之力使敌万乘，则齐、荆之欲不得行于二国矣。","夫古今异俗，新故异备。如欲以宽缓之政，治急世之民，犹无辔策而御駻马，此不知之患也。今儒、墨皆称先王兼爱天下，则视民如父母。何以明其然也？曰： 司寇行刑，君为之不举乐；闻死刑之报，君为流涕。 此所举先王也。夫以君臣为如父子则必治，推是言之，是无乱父子也。人之情性莫先于父母，皆见爱而未必治也，虽厚爱矣，奚遽不乱？今先王之爱民，不过父母之爱子，子未必不乱也，则民奚遽治哉？且夫以法行刑，而君为之流涕，此以效仁，非以为治也。夫垂泣不欲刑者，仁也；然而不可不刑者，法也。先王胜其法，不听其泣，则仁之不可以为治亦明矣。","且民者固服于势，寡能怀于义。仲尼，天下圣人也，修行明道以游海内，海内说其仁、美其义而为服役者七十人。盖贵仁者寡，能义者难也。故以天下之大，而为服役者七十人，而仁义者一人。鲁哀公，下主也，南面君国，境内之民莫敢不臣。民者固服于势，诚易以服人，故仲尼反为臣而哀公顾为君。仲尼非怀其义，服其势也。故以义则仲尼不服于哀公，乘势则哀公臣仲尼。今学者之说人主也，不乘必胜之势，而务行仁义则可以王，是求人主之必及仲尼，而以世之凡民皆如列徒，此必不得之数也。","今有不才之子，父母怒之弗为改，乡人谯之弗为动，师长教之弗为变。夫以父母之爱、乡人之行、师长之智，三美加焉，而终不动，其胫毛不改。州部之吏，操官兵，推公法，而求索奸人，然后恐惧，变其节，易其行矣。故父母之爱不足以教子，必待州部之严刑者，民固骄于爱、听于威矣。故十仞之城，楼季弗能逾者，峭也；千仞之山，跛牂易牧者，夷也。故明王峭其法而严其刑也。布帛寻常，庸人不释；铄金百镒，盗跖不掇。不必害，则不释寻常；必害手，则不掇百溢。故明主必其诛也。是以赏莫如厚而信，使民利之；罚莫如重而必，使民畏之；法莫如一而固，使民知之。故主施赏不迁，行诛无赦，誉辅其赏，毁随其罚，则贤、不肖俱尽其力矣。","今则不然。其有功也爵之，而卑其士官也；以其耕作也赏之，而少其家业也；以其不收也外之，而高其轻世也；以其犯禁罪之，而多其有勇也。毁誉、赏罚之所加者，相与悖缪也，故法禁坏而民愈乱。今兄弟被侵，必攻者，廉也；知友辱，随仇者，贞也。廉贞之行成，而君上之法犯矣。人主尊贞廉之行，而忘犯禁之罪，故民程于勇，而吏不能胜也。不事力而衣食，谓之能；不战功而尊，则谓之贤。贤能之行成，而兵弱而地荒矣。人主说贤能之行，而忘兵弱地荒之祸，则私行立而公利灭矣。","儒以文乱法，侠以武犯禁，而人主兼礼之，此所以乱也。夫离法者罪，而诸先生以文学取；犯禁者诛，而群侠以私剑养。故法之所非，君之所取；吏之所诛，上之所养也。法、趣、上、下，四相反也，而无所定，虽有十黄帝不能治也。故行仁义者非所誉，誉之则害功，工文学者非所用，用之则乱法。楚之有直躬，其父窃羊，而谒之吏。令尹曰： 杀之！ 以为直于君而曲于父，报而罪之。以是观之，夫君之直臣，父之暴子也。鲁人从君战，三战三北。仲尼问其故，对曰： 吾有老父，身死莫之养也。 仲尼以为孝，举而上之。以是观之，夫父之孝子，君之背臣也。故令尹诛而楚奸不上闻，仲尼赏而鲁民易降北。上下之利，若是其异也，而人主兼举匹夫之行，而求致社稷之福，必不几矣。","古者苍颉之作书也，自环者谓之私，背私谓之公，公私之相背也，乃苍颉固以知之矣。今以为同利者，不察之患也，然则为匹夫计者，莫如修行义而习文学。行义修则见信，见信则受事；文学习则为明师，为明师则显荣：此匹夫之美也。然则无功而受事，无爵而显荣，为有政如此，则国必乱，主必危矣。故不相容之事，不两立也。斩敌者受赏，而高慈惠之行；拔城者受爵禄，而信廉爱之说；坚甲厉兵以备难，而美荐绅之饰；富国以农，距敌恃卒，而贵文学之士；废敬上畏法之民，而养游侠私剑之属。举行如此，治强不可得也。国平养儒侠，难至用介士，所利非所用，所用非所利。是故服事者简其业，而于游学者日众，是世之所以乱也。","且世之所谓贤者，贞信之行也；所谓智者，微妙之言也。微妙之言，上智之所难知也。今为众人法，而以上智之所难知，则民无从识之矣。故糟糠不饱者不务粱肉，短褐不完者不待文绣。夫治世之事，急者不得，则缓者非所务也。今所治之政，民间之事，夫妇所明知者不用，而慕上知之论，则其于治反矣。故微妙之言，非民务也。若夫贤良贞信之行者，必将贵不欺之士；不欺之士者，亦无不欺之术也。布衣相与交，无富厚以相利，无威势以相惧也，故求不欺之士。今人主处制人之势，有一国之厚，重赏严诛，得操其柄，以修明术之所烛，虽有田常、子罕之臣，不敢欺也，奚待于不欺之士？今贞信之士不盈于十，而境内之官以百数，必任贞信之士，则人不足官。人不足官，则治者寡而乱者众矣。故明主之道，一法而不求智，固术而不慕信，故法不败，而群官无奸诈矣。","今人主之于言也，说其辩而不求其当焉；其用于行也，美其声而不责其功。是以天下之众，其谈言者务为辨而不周于用，故举先王言仁义者盈廷，而政不免于乱；行身者竞于为高而不合于功，故智士退处岩穴，归禄不受，而兵不免于弱，政不免于乱，此其故何也？民之所誉，上之所礼，乱国之术也。今境内之民皆言治，藏商、管之法者家有之，而国贫，言耕者众，执耒者寡也；境内皆言兵，藏孙、吴之书者家有之，而兵愈弱，言战者多，被甲者少也。故明主用其力，不听其言；赏其功，伐禁无用。故民尽死力以从其上。夫耕之用力也劳，而民为之者，曰：可得以富也。战之事也危，而民为之者，曰：可得以贵也。今修文学，习言谈，则无耕之劳而有富之实，无战之危而有贵之尊，则人孰不为也？是以百人事智而一人用力。事智者众，则法败；用力者寡，则国贫：此世之所以乱也。&gt;&gt;&gt;&gt;故明主之国，无书简之文，以法为教；无先王之语，以吏为师；无私剑之捍，以斩首为勇。是境内之民，其言谈者必轨于法，动作者归之于功，为勇者尽之于军。是故无事则国富，有事则兵强，此之谓王资。既畜王资而承敌国之釁，超五帝侔三王者，必此法也。","今则不然，士民纵恣于内，言谈者为势于外，外内称恶，以待强敌，不亦殆乎！故群臣之言外事者，非有分于从衡之党，则有仇雠之忠，而借力于国也。从者，合众弱以攻一强也；而衡者，事一强以攻众弱也：皆非所以持国也。今人臣之言衡者，皆曰： 不事大，则遇敌受祸矣。 事大未必有实，则举图而委，效玺而请兵矣。献图则地削，效玺则名卑，地削则国削，名卑则政乱矣。事大为衡，未见其利也，而亡地乱政矣。人臣之言从者，皆曰： 不救小而伐大，则失天下，失天下则国危，国危而主卑。 救小未必有实，则起兵而敌大矣。救小未必能存，而交大未必不有疏，有疏则为强国制矣。出兵则军败，退守则城拔。救小为从，未见其利，而亡地败军矣。是故事强，则以外权士官于内；救小，则以内重求利于外。国利未立，封土厚禄至矣；主上虽卑，人臣尊矣；国地虽削，私家富矣。事成，则以权长重；事败，则以富退处。人主之于其听说也于其臣，事未成则爵禄已尊矣；事败而弗诛，则游说之士孰不为用缯缴之说而侥幸其后？故破国亡主以听言谈者之浮说。此其故何也？是人君不明乎公私之利，不察当否之言，而诛罚不必其后也。皆曰： 外事，大可以王，小可以安。 夫王者，能攻人者也；而安，则不可攻也。强，则能攻人者也；治，则不可攻也。治强不可责于外，内政之有也。今不行法术于内，而事智于外，则不至于治强矣。","鄙谚曰： 长袖善舞，多钱善贾。 此言多资之易为工也。故治强易为谋，弱乱难为计。故用于秦者，十变而谋希失；用于燕者，一变而计希得。非用于秦者必智，用于燕者必愚也，盖治乱之资异也。故周去秦为从，期年而举；卫离魏为衡，半岁而亡。是周灭于从，卫亡于衡也。使周、卫缓其从衡之计，而严其境内之治，明其法禁，必其赏罚，尽其地力以多其积，致其民死以坚其城守，天下得其地则其利少，攻其国则其伤大，万乘之国莫敢自顿于坚城之下，而使强敌裁其弊也，此必不亡之术也。舍必不亡之术而道必灭之事，治国者之过也。智困于内而政乱于外，则亡不可振也。","民之故计，皆就安利如辟危穷。今为之攻战，进则死于敌，退则死于诛，则危矣。弃私家之事而必汗马之劳，家困而上弗论，则穷矣。穷危之所在也，民安得勿避？故事私门而完解舍，解舍完则远战，远战则安。行货赂而袭当涂者则求得，求得则私安，私安则利之所在，安得勿就？是以公民少而私人众矣。","夫明王治国之政，使其商工游食之民少而名卑，以寡趣本务而趋末作。今世近习之请行，则官爵可买；官爵可买，则商工不卑也矣。奸财货贾得用于市，则商人不少矣。聚敛倍农而致尊过耕战之士，则耿介之士寡而高价之民多矣。","是故乱国之俗：其学者，则称先王之道以籍仁义，盛容服而饰辩说，以疑当世之法，而贰人主之心。其言古者，为设诈称，借于外力，以成其私，而遗社稷之利。其带剑者，聚徒属，立节操，以显其名，而犯五官之禁。其患御者，积于私门，尽货赂，而用重人之谒，退汗马之劳。其商工之民，修治苦窳之器，聚弗靡之财，蓄积待时，而侔农夫之利。此五者，邦之蠹也。人主不除此五蠹之民，不养耿介之士，则海内虽有破亡之国，削灭之朝，亦勿怪矣。"]}],
  paragraphs:[
    "宋国有个耕田的人，田里立着一截老树桩。每天，他扶着耒翻土，从地头慢慢走到树桩旁，再转身向另一头走去。汗珠落进土里，新翻的泥一行接一行。",
    "一天，一只兔子飞快地穿过田野，没留神撞上树桩，折断了脖子，倒在旁边。耕田人放下农具走过去，拾起兔子。这一天，他没有多费力气，便得到了一份意外的收获。",
    "回家的路上，他想起兔肉下锅的香气，也想起每天弯腰翻土的辛苦。他回头望望那截树桩，心里冒出一个念头：既然兔子会自己撞来，明天也许还会有一只。",
    "第二天，他把耒搁在田边，坐到树桩旁等候。太阳从东边的树梢升到头顶，又慢慢偏向西边。没有兔子出现，只有田里的草趁着泥土松软，悄悄从庄稼旁边钻出来。",
    "往后的日子，他仍常去守着。听见草叶一响，他便立刻抬头；看见远处有影子，他便以为是兔子。可影子散进草丛，树桩还是树桩，空着的手也还是空着。",
    "兔子终究没有再得到，这件事却在宋国传开，成了人们谈论的笑话。树桩仍在田里，农具也仍靠在旁边。偶然到来的一次收获，究竟该怎样看待，故事把这个问题留在了笑声之后。"

  originalSections:[{"title": "THE UGLY DUCKLING", "paragraphs": ["It was lovely summer weather in the country, and the golden corn, the green oats, and the haystacks piled up in the meadows looked beautiful. The stork walking about on his long red legs chattered in the Egyptian language, which he had learnt from his mother. The corn-fields and meadows were surrounded by large forests, in the midst of which were deep pools. It was, indeed, delightful to walk about in the country. In a sunny spot stood a pleasant old farm-house close by a deep river, and from the house down to the water side grew great burdock leaves, so high, that under the tallest of them a little child could stand upright. The spot was as wild as the centre of a thick wood. In this snug retreat sat a duck on her nest, watching for her young brood to hatch; she was beginning to get tired of her task, for the little ones were a long time coming out of their shells, and she seldom had any visitors. The other ducks liked much better to swim about in the river than to climb the slippery banks, and sit under a burdock leaf, to have a gossip with her. At length one shell cracked, and then another, and from each egg came a living creature that lifted its head and cried, \"Peep, peep.\" \"Quack, quack,\" said the mother, and then they all quacked as well as they could, and looked about them on every side at the large green leaves. Their mother allowed them to look as much as they liked, because green is good for the eyes. \"How large the world is,\" said the young ducks, when they found how much more room they now had than while they were inside the egg-shell. \"Do you imagine this is the whole world?\" asked the mother; \"Wait till you have seen the garden; it stretches far beyond that to the parson's field, but I have never ventured to such a distance. Are you all out?\" she continued, rising; \"No, I declare, the largest egg lies there still. I wonder how long this is to last, I am quite tired of it;\" and she seated herself again on the nest.", "\"Well, how are you getting on?\" asked an old duck, who paid her a visit.", "\"One egg is not hatched yet,\" said the duck, \"it will not break. But just look at all the others, are they not the prettiest little ducklings you ever saw? They are the image of their father, who is so unkind, he never comes to see.\"", "\"Let me see the egg that will not break,\" said the duck; \"I have no doubt it is a turkey's egg. I was persuaded to hatch some once, and after all my care and trouble with the young ones, they were afraid of the water. I quacked and clucked, but all to no purpose. I could not get them to venture in. Let me look at the egg. Yes, that is a turkey's egg; take my advice, leave it where it is and teach the other children to swim.\"", "\"I think I will sit on it a little while longer,\" said the duck; \"as I have sat so long already, a few days will be nothing.\"", "\"Please yourself,\" said the old duck, and she went away.", "At last the large egg broke, and a young one crept forth crying, \"Peep, peep.\" It was very large and ugly. The duck stared at it and exclaimed, \"It is very large and not at all like the others. I wonder if it really is a turkey. We shall soon find it out, however when we go to the water. It must go in, if I have to push it myself.\"", "On the next day the weather was delightful, and the sun shone brightly on the green burdock leaves, so the mother duck took her young brood down to the water, and jumped in with a splash. \"Quack, quack,\" cried she, and one after another the little ducklings jumped in. The water closed over their heads, but they came up again in an instant, and swam about quite prettily with their legs paddling under them as easily as possible, and the ugly duckling was also in the water swimming with them.", "\"Oh,\" said the mother, \"that is not a turkey; how well he uses his legs, and how upright he holds himself! He is my own child, and he is not so very ugly after all if you look at him properly. Quack, quack! come with me now, I will take you into grand society, and introduce you to the farmyard, but you must keep close to me or you may be trodden upon; and, above all, beware of the cat.\"", "When they reached the farmyard, there was a great disturbance, two families were fighting for an eel's head, which, after all, was carried off by the cat. \"See, children, that is the way of the world,\" said the mother duck, whetting her beak, for she would have liked the eel's head herself. \"Come, now, use your legs, and let me see how well you can behave. You must bow your heads prettily to that old duck yonder; she is the highest born of them all, and has Spanish blood, therefore, she is well off. Don't you see she has a red flag tied to her leg, which is something very grand, and a great honor for a duck; it shows that every one is anxious not to lose her, as she can be recognized both by man and beast. Come, now, don't turn your toes, a well-bred duckling spreads his feet wide apart, just like his father and mother, in this way; now bend your neck, and say 'quack.'\"", "The ducklings did as they were bid, but the other duck stared, and said, \"Look, here comes another brood, as if there were not enough of us already! and what a queer looking object one of them is; we don't want him here,\" and then one flew out and bit him in the neck.", "\"Let him alone,\" said the mother; \"he is not doing any harm.\"", "\"Yes, but he is so big and ugly,\" said the spiteful duck \"and therefore he must be turned out.\"", "\"The others are very pretty children,\" said the old duck, with the rag on her leg, \"all but that one; I wish his mother could improve him a little.\"", "\"That is impossible, your grace,\" replied the mother; \"he is not pretty; but he has a very good disposition, and swims as well or even better than the others. I think he will grow up pretty, and perhaps be smaller; he has remained too long in the egg, and therefore his figure is not properly formed;\" and then she stroked his neck and smoothed the feathers, saying, \"It is a drake, and therefore not of so much consequence. I think he will grow up strong, and able to take care of himself.\"", "\"The other ducklings are graceful enough,\" said the old duck. \"Now make yourself at home, and if you can find an eel's head, you can bring it to me.\"", "And so they made themselves comfortable; but the poor duckling, who had crept out of his shell last of all, and looked so ugly, was bitten and pushed and made fun of, not only by the ducks, but by all the poultry. \"He is too big,\" they all said, and the turkey cock, who had been born into the world with spurs, and fancied himself really an emperor, puffed himself out like a vessel in full sail, and flew at the duckling, and became quite red in the head with passion, so that the poor little thing did not know where to go, and was quite miserable because he was so ugly and laughed at by the whole farmyard. So it went on from day to day till it got worse and worse. The poor duckling was driven about by every one; even his brothers and sisters were unkind to him, and would say, \"Ah, you ugly creature, I wish the cat would get you,\" and his mother said she wished he had never been born. The ducks pecked him, the chickens beat him, and the girl who fed the poultry kicked him with her feet. So at last he ran away, frightening the little birds in the hedge as he flew over the palings.", "\"They are afraid of me because I am ugly,\" he said. So he closed his eyes, and flew still farther, until he came out on a large moor, inhabited by wild ducks. Here he remained the whole night, feeling very tired and sorrowful.", "In the morning, when the wild ducks rose in the air, they stared at their new comrade. \"What sort of a duck are you?\" they all said, coming round him.", "He bowed to them, and was as polite as he could be, but he did not reply to their question. \"You are exceedingly ugly,\" said the wild ducks, \"but that will not matter if you do not want to marry one of our family.\"", "Poor thing! he had no thoughts of marriage; all he wanted was permission to lie among the rushes, and drink some of the water on the moor. After he had been on the moor two days, there came two wild geese, or rather goslings, for they had not been out of the egg long, and were very saucy. \"Listen, friend,\" said one of them to the duckling, \"you are so ugly, that we like you very well. Will you go with us, and become a bird of passage? Not far from here is another moor, in which there are some pretty wild geese, all unmarried. It is a chance for you to get a wife; you may be lucky, ugly as you are.\"", "\"Pop, pop,\" sounded in the air, and the two wild geese fell dead among the rushes, and the water was tinged with blood. \"Pop, pop,\" echoed far and wide in the distance, and whole flocks of wild geese rose up from the rushes. The sound continued from every direction, for the sportsmen surrounded the moor, and some were even seated on branches of trees, overlooking the rushes. The blue smoke from the guns rose like clouds over the dark trees, and as it floated away across the water, a number of sporting dogs bounded in among the rushes, which bent beneath them wherever they went. How they terrified the poor duckling! He turned away his head to hide it under his wing, and at the same moment a large terrible dog passed quite near him. His jaws were open, his tongue hung from his mouth, and his eyes glared fearfully. He thrust his nose close to the duckling, showing his sharp teeth, and then, \"splash, splash,\" he went into the water without touching him, \"Oh,\" sighed the duckling, \"how thankful I am for being so ugly; even a dog will not bite me.\" And so he lay quite still, while the shot rattled through the rushes, and gun after gun was fired over him. It was late in the day before all became quiet, but even then the poor young thing did not dare to move. He waited quietly for several hours, and then, after looking carefully around him, hastened away from the moor as fast as he could. He ran over field and meadow till a storm arose, and he could hardly struggle against it. Towards evening, he reached a poor little cottage that seemed ready to fall, and only remained standing because it could not decide on which side to fall first. The storm continued so violent, that the duckling could go no farther; he sat down by the cottage, and then he noticed that the door was not quite closed in consequence of one of the hinges having given way. There was therefore a narrow opening near the bottom large enough for him to slip through, which he did very quietly, and got a shelter for the night. A woman, a tom cat, and a hen lived in this cottage. The tom cat, whom the mistress called, \"My little son,\" was a great favorite; he could raise his back, and purr, and could even throw out sparks from his fur if it were stroked the wrong way. The hen had very short legs, so she was called \"Chickie short legs.\" She laid good eggs, and her mistress loved her as if she had been her own child. In the morning, the strange visitor was discovered, and the tom cat began to purr, and the hen to cluck.", "\"What is that noise about?\" said the old woman, looking round the room, but her sight was not very good; therefore, when she saw the duckling she thought it must be a fat duck, that had strayed from home. \"Oh what a prize!\" she exclaimed, \"I hope it is not a drake, for then I shall have some duck's eggs. I must wait and see.\" So the duckling was allowed to remain on trial for three weeks, but there were no eggs. Now the tom cat was the master of the house, and the hen was mistress, and they always said, \"We and the world,\" for they believed themselves to be half the world, and the better half too. The duckling thought that others might hold a different opinion on the subject, but the hen would not listen to such doubts. \"Can you lay eggs?\" she asked. \"No.\" \"Then have the goodness to hold your tongue.\" \"Can you raise your back, or purr, or throw out sparks?\" said the tom cat. \"No.\" \"Then you have no right to express an opinion when sensible people are speaking.\" So the duckling sat in a corner, feeling very low spirited, till the sunshine and the fresh air came into the room through the open door, and then he began to feel such a great longing for a swim on the water, that he could not help telling the hen.", "\"What an absurd idea,\" said the hen. \"You have nothing else to do, therefore you have foolish fancies. If you could purr or lay eggs, they would pass away.\"", "\"But it is so delightful to swim about on the water,\" said the duckling, \"and so refreshing to feel it close over your head, while you dive down to the bottom.\"", "\"Delightful, indeed!\" said the hen, \"why you must be crazy! Ask the cat, he is the cleverest animal I know, ask him how he would like to swim about on the water, or to dive under it, for I will not speak of my own opinion; ask our mistress, the old woman--there is no one in the world more clever than she is. Do you think she would like to swim, or to let the water close over her head?\"", "\"You don't understand me,\" said the duckling.", "\"We don't understand you? Who can understand you, I wonder? Do you consider yourself more clever than the cat, or the old woman? I will say nothing of myself. Don't imagine such nonsense, child, and thank your good fortune that you have been received here. Are you not in a warm room, and in society from which you may learn something. But you are a chatterer, and your company is not very agreeable. Believe me, I speak only for your own good. I may tell you unpleasant truths, but that is a proof of my friendship. I advise you, therefore, to lay eggs, and learn to purr as quickly as possible.\"", "\"I believe I must go out into the world again,\" said the duckling.", "\"Yes, do,\" said the hen. So the duckling left the cottage, and soon found water on which it could swim and dive, but was avoided by all other animals, because of its ugly appearance. Autumn came, and the leaves in the forest turned to orange and gold. Then, as winter approached, the wind caught them as they fell and whirled them in the cold air. The clouds, heavy with hail and snow-flakes, hung low in the sky, and the raven stood on the ferns crying, \"Croak, croak.\" It made one shiver with cold to look at him. All this was very sad for the poor little duckling. One evening, just as the sun set amid radiant clouds, there came a large flock of beautiful birds out of the bushes. The duckling had never seen any like them before. They were swans, and they curved their graceful necks, while their soft plumage shown with dazzling whiteness. They uttered a singular cry, as they spread their glorious wings and flew away from those cold regions to warmer countries across the sea. As they mounted higher and higher in the air, the ugly little duckling felt quite a strange sensation as he watched them. He whirled himself in the water like a wheel, stretched out his neck towards them, and uttered a cry so strange that it frightened himself. Could he ever forget those beautiful, happy birds; and when at last they were out of his sight, he dived under the water, and rose again almost beside himself with excitement. He knew not the names of these birds, nor where they had flown, but he felt towards them as he had never felt for any other bird in the world. He was not envious of these beautiful creatures, but wished to be as lovely as they. Poor ugly creature, how gladly he would have lived even with the ducks had they only given him encouragement. The winter grew colder and colder; he was obliged to swim about on the water to keep it from freezing, but every night the space on which he swam became smaller and smaller. At length it froze so hard that the ice in the water crackled as he moved, and the duckling had to paddle with his legs as well as he could, to keep the space from closing up. He became exhausted at last, and lay still and helpless, frozen fast in the ice.", "Early in the morning, a peasant, who was passing by, saw what had happened. He broke the ice in pieces with his wooden shoe, and carried the duckling home to his wife. The warmth revived the poor little creature; but when the children wanted to play with him, the duckling thought they would do him some harm; so he started up in terror, fluttered into the milk-pan, and splashed the milk about the room. Then the woman clapped her hands, which frightened him still more. He flew first into the butter-cask, then into the meal-tub, and out again. What a condition he was in! The woman screamed, and struck at him with the tongs; the children laughed and screamed, and tumbled over each other, in their efforts to catch him; but luckily he escaped. The door stood open; the poor creature could just manage to slip out among the bushes, and lie down quite exhausted in the newly fallen snow.", "It would be very sad, were I to relate all the misery and privations which the poor little duckling endured during the hard winter; but when it had passed, he found himself lying one morning in a moor, amongst the rushes. He felt the warm sun shining, and heard the lark singing, and saw that all around was beautiful spring. Then the young bird felt that his wings were strong, as he flapped them against his sides, and rose high into the air. They bore him onwards, until he found himself in a large garden, before he well knew how it had happened. The apple-trees were in full blossom, and the fragrant elders bent their long green branches down to the stream which wound round a smooth lawn. Everything looked beautiful, in the freshness of early spring. From a thicket close by came three beautiful white swans, rustling their feathers, and swimming lightly over the smooth water. The duckling remembered the lovely birds, and felt more strangely unhappy than ever.", "\"I will fly to those royal birds,\" he exclaimed, \"and they will kill me, because I am so ugly, and dare to approach them; but it does not matter: better be killed by them than pecked by the ducks, beaten by the hens, pushed about by the maiden who feeds the poultry, or starved with hunger in the winter.\"", "Then he flew to the water, and swam towards the beautiful swans. The moment they espied the stranger, they rushed to meet him with outstretched wings.", "\"Kill me,\" said the poor bird; and he bent his head down to the surface of the water, and awaited death.", "But what did he see in the clear stream below? His own image; no longer a dark, gray bird, ugly and disagreeable to look at, but a graceful and beautiful swan. To be born in a duck's nest, in a farmyard, is of no consequence to a bird, if it is hatched from a swan's egg. He now felt glad at having suffered sorrow and trouble, because it enabled him to enjoy so much better all the pleasure and happiness around him; for the great swans swam round the new-comer, and stroked his neck with their beaks, as a welcome.", "Into the garden presently came some little children, and threw bread and cake into the water.", "\"See,\" cried the youngest, \"there is a new one;\" and the rest were delighted, and ran to their father and mother, dancing and clapping their hands, and shouting joyously, \"There is another swan come; a new one has arrived.\"", "Then they threw more bread and cake into the water, and said, \"The new one is the most beautiful of all; he is so young and pretty.\" And the old swans bowed their heads before him.", "Then he felt quite ashamed, and hid his head under his wing; for he did not know what to do, he was so happy, and yet not at all proud. He had been persecuted and despised for his ugliness, and now he heard them say he was the most beautiful of all the birds. Even the elder-tree bent down its bows into the water before him, and the sun shone warm and bright. Then he rustled his feathers, curved his slender neck, and cried joyfully, from the depths of his heart, \"I never dreamed of such happiness as this, while I was an ugly duckling.\""]}],
  paragraphs:[
    "夏天的乡下，一只鸭妈妈守在窝边，等蛋壳一个个裂开。小鸭子们钻出来，抖着嫩黄的绒毛，只有最后那只大蛋迟迟没有动静。等它终于破壳，里面走出的小鸭个头很大，羽毛灰扑扑的，和兄弟姐妹都不一样。",
    "鸭场里的目光很快围了过来。鸡鸭们议论他的模样，有的啄他，有的把他推到一边。鸭妈妈起初护着他，带他到水边，看他在水里游得安稳。可是周围的嘲笑没有停下，小鸭也越来越不敢抬头。",
    "他离开熟悉的院子，独自走到野外的沼泽。那里的野鸭同样嫌弃他的外貌，他只好尽量躲在芦苇深处。远处猎人的声响惊起群鸟，他屏住呼吸藏了很久，直到四周重新安静，才去寻找一点食物和水。",
    "后来他到过一间小屋。屋里的猫和母鸡各有自己的本领，也各自认定别人应该照自己的方式生活。小鸭无法成为他们期待的样子，心里却仍惦记开阔的水面。于是，他再次离开，走向越来越冷的原野。",
    "秋风把叶子染黄，又一片片带走。迁徙的鸟群从头顶经过，湖水一天比一天冷。小鸭必须不停游动，才不让身边的水结住。他熬过漫长的冬夜，也曾在天上看见姿态优美的天鹅，心里生出一种自己还说不明白的向往。",
    "春天终于回到湖面。冰霜退去，芦苇抽出新绿，小鸭也在艰难的日子里长大了。他展开翅膀，发觉自己飞得比从前更高、更稳。飞过树林和花园时，他看见几只天鹅正在明亮的水上游动。",
    "他放低翅膀，向天鹅们靠近，准备承受又一次排斥。可那些天鹅没有驱赶他，反而围拢过来，用友好的姿态迎接他。他疑惑地低下头，第一次在水面的倒影里看清自己：长颈优雅，羽毛洁白，翅膀宽阔。",
    "原来，他并不是一只长得奇怪的鸭子，而是一只直到春天才认清自己的天鹅。花园里有人称赞新来的天鹅，他没有因此轻视曾经的伙伴，也没有忘记沼泽和寒冬。那些经历不会突然消失，却不再需要由别人的嘲笑来解释。",
    "微风穿过花园，水面荡开柔和的波纹。他舒展翅膀，和同伴一起向前游去。曾经让他羞怯的低垂目光，如今可以安静地迎向天空；他终于能够在自己的模样里，自在地呼吸。"

  originalSections:[{"title": "THE FROG-PRINCE", "paragraphs": ["One fine evening a young princess put on her bonnet and clogs, and went out to take a walk by herself in a wood; and when she came to a cool spring of water, that rose in the midst of it, she sat herself down to rest a while. Now she had a golden ball in her hand, which was her favourite plaything; and she was always tossing it up into the air, and catching it again as it fell. After a time she threw it up so high that she missed catching it as it fell; and the ball bounded away, and rolled along upon the ground, till at last it fell down into the spring. The princess looked into the spring after her ball, but it was very deep, so deep that she could not see the bottom of it. Then she began to bewail her loss, and said, ‘Alas! if I could only get my ball again, I would give all my fine clothes and jewels, and everything that I have in the world.’", "Whilst she was speaking, a frog put its head out of the water, and said, ‘Princess, why do you weep so bitterly?’ ‘Alas!’ said she, ‘what can you do for me, you nasty frog? My golden ball has fallen into the spring.’ The frog said, ‘I want not your pearls, and jewels, and fine clothes; but if you will love me, and let me live with you and eat from off your golden plate, and sleep upon your bed, I will bring you your ball again.’ ‘What nonsense,’ thought the princess, ‘this silly frog is talking! He can never even get out of the spring to visit me, though he may be able to get my ball for me, and therefore I will tell him he shall have what he asks.’ So she said to the frog, ‘Well, if you will bring me my ball, I will do all you ask.’ Then the frog put his head down, and dived deep under the water; and after a little while he came up again, with the ball in his mouth, and threw it on the edge of the spring. As soon as the young princess saw her ball, she ran to pick it up; and she was so overjoyed to have it in her hand again, that she never thought of the frog, but ran home with it as fast as she could. The frog called after her, ‘Stay, princess, and take me with you as you said,’ But she did not stop to hear a word.", "The next day, just as the princess had sat down to dinner, she heard a strange noise--tap, tap--plash, plash--as if something was coming up the marble staircase: and soon afterwards there was a gentle knock at the door, and a little voice cried out and said:", "‘Open the door, my princess dear,\nOpen the door to thy true love here!\nAnd mind the words that thou and I said\nBy the fountain cool, in the greenwood shade.’", "Then the princess ran to the door and opened it, and there she saw the frog, whom she had quite forgotten. At this sight she was sadly frightened, and shutting the door as fast as she could came back to her seat. The king, her father, seeing that something had frightened her, asked her what was the matter. ‘There is a nasty frog,’ said she, ‘at the door, that lifted my ball for me out of the spring this morning: I told him that he should live with me here, thinking that he could never get out of the spring; but there he is at the door, and he wants to come in.’", "While she was speaking the frog knocked again at the door, and said:", "‘Open the door, my princess dear,\nOpen the door to thy true love here!\nAnd mind the words that thou and I said\nBy the fountain cool, in the greenwood shade.’", "Then the king said to the young princess, ‘As you have given your word you must keep it; so go and let him in.’ She did so, and the frog hopped into the room, and then straight on--tap, tap--plash, plash--from the bottom of the room to the top, till he came up close to the table where the princess sat. ‘Pray lift me upon chair,’ said he to the princess, ‘and let me sit next to you.’ As soon as she had done this, the frog said, ‘Put your plate nearer to me, that I may eat out of it.’ This she did, and when he had eaten as much as he could, he said, ‘Now I am tired; carry me upstairs, and put me into your bed.’ And the princess, though very unwilling, took him up in her hand, and put him upon the pillow of her own bed, where he slept all night long. As soon as it was light he jumped up, hopped downstairs, and went out of the house. ‘Now, then,’ thought the princess, ‘at last he is gone, and I shall be troubled with him no more.’", "But she was mistaken; for when night came again she heard the same tapping at the door; and the frog came once more, and said:", "‘Open the door, my princess dear,\nOpen the door to thy true love here!\nAnd mind the words that thou and I said\nBy the fountain cool, in the greenwood shade.’", "And when the princess opened the door the frog came in, and slept upon her pillow as before, till the morning broke. And the third night he did the same. But when the princess awoke on the following morning she was astonished to see, instead of the frog, a handsome prince, gazing on her with the most beautiful eyes she had ever seen, and standing at the head of her bed.", "He told her that he had been enchanted by a spiteful fairy, who had changed him into a frog; and that he had been fated so to abide till some princess should take him out of the spring, and let him eat from her plate, and sleep upon her bed for three nights. ‘You,’ said the prince, ‘have broken his cruel charm, and now I have nothing to wish for but that you should go with me into my father’s kingdom, where I will marry you, and love you as long as you live.’", "The young princess, you may be sure, was not long in saying ‘Yes’ to all this; and as they spoke a gay coach drove up, with eight beautiful horses, decked with plumes of feathers and a golden harness; and behind the coach rode the prince’s servant, faithful Heinrich, who had bewailed the misfortunes of his dear master during his enchantment so long and so bitterly, that his heart had well-nigh burst.", "They then took leave of the king, and got into the coach with eight horses, and all set out, full of joy and merriment, for the prince’s kingdom, which they reached safely; and there they lived happily a great many years."]}],
  paragraphs:[
    "王宫附近有一口清凉的井，井边长着大树。公主常在树荫下玩一只金球，把它抛向空中，再稳稳接住。金球在阳光下转着圈，是她最心爱的玩具。",
    "一天，球从她的指尖滑出去，没有落在草地上，而是扑通一声掉进深井。公主望不见水底，急得坐在井边。青蛙从水里探出头，说可以替她捞回金球，但希望她答应让自己做她的伙伴，一起吃饭、玩耍，也在王宫里休息。",
    "公主一心想着金球，匆匆答应了。青蛙潜入水中，不一会儿用头顶回金球。公主接过球，欢喜得忘了刚才的话，转身便跑回王宫，只留下青蛙在井边呼唤。",
    "第二天，宫门外响起轻轻的敲门声。青蛙来说明来意，公主有些难为情。国王听完整件事，没有大声责骂，只提醒她：别人信守了约定，自己也该认真履行说过的话。",
    "公主把门打开，请青蛙进来，又在餐桌边给它留了一个位置。她起初动作僵硬，眼睛总望向别处；青蛙没有催促，只安静等着。慢慢地，她把小椅子挪近一些，也愿意听青蛙讲井底的水草和雨声。",
    "到了休息时，青蛙希望被安顿在房里的一只软垫上。公主想起自己拿到金球时的欢喜，也想起井边那个被遗忘的身影。这一次，她没有逃走，而是小心捧起青蛙，把它放到软垫旁，并为自己的失约道了歉。",
    "晨光落进房间时，软垫旁站起了一位年轻王子。他说，自己曾被咒语变成青蛙，直到有人愿意真正接纳他、履行约定，咒语才会解除。公主又惊又喜，也明白转变并不是金球带来的奖赏，而是一段被认真对待的关系。",
    "王子感谢公主，公主也感谢他给了自己改正的机会。后来，他们一同前往王子的家乡。公主带上了那只金球，却不再只顾着把它紧紧握在手里；她更愿意记得，一句答应别人的话，应该怎样落到实处。"
  ],

  originalSections:[{"title": "CHAPTER I. Down the Rabbit-Hole", "paragraphs": ["Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”", "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.", "There was nothing so _very_ remarkable in that; nor did Alice think it so _very_ much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually _took a watch out of its waistcoat-pocket_, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.", "In another moment down went Alice after it, never once considering how in the world she was to get out again.", "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.", "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “ORANGE MARMALADE”, but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it.", "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)", "Down, down, down. Would the fall _never_ come to an end? “I wonder how many miles I’ve fallen by this time?” she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a _very_ good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)", "Presently she began again. “I wonder if I shall fall right _through_ the earth! How funny it’ll seem to come out among the people that walk with their heads downward! The Antipathies, I think—” (she was rather glad there _was_ no one listening, this time, as it didn’t sound at all the right word) “—but I shall have to ask them what the name of the country is, you know. Please, Ma’am, is this New Zealand or Australia?” (and she tried to curtsey as she spoke—fancy _curtseying_ as you’re falling through the air! Do you think you could manage it?) “And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”", "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.", "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.", "There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.", "Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!", "Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I think I could, if I only knew how to begin.” For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible.", "There seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it, (“which certainly was not here before,” said Alice,) and round the neck of the bottle was a paper label, with the words “DRINK ME,” beautifully printed on it in large letters.", "It was all very well to say “Drink me,” but the wise little Alice was not going to do _that_ in a hurry. “No, I’ll look first,” she said, “and see whether it’s marked ‘_poison_’ or not”; for she had read several nice little histories about children who had got burnt, and eaten up by wild beasts and other unpleasant things, all because they _would_ not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it too long; and that if you cut your finger _very_ deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked “poison,” it is almost certain to disagree with you, sooner or later.", "However, this bottle was _not_ marked “poison,” so Alice ventured to taste it, and finding it very nice, (it had, in fact, a sort of mixed flavour of cherry-tart, custard, pine-apple, roast turkey, toffee, and hot buttered toast,) she very soon finished it off.", "“What a curious feeling!” said Alice; “I must be shutting up like a telescope.”", "And so it was indeed: she was now only ten inches high, and her face brightened up at the thought that she was now the right size for going through the little door into that lovely garden. First, however, she waited for a few minutes to see if she was going to shrink any further: she felt a little nervous about this; “for it might end, you know,” said Alice to herself, “in my going out altogether, like a candle. I wonder what I should be like then?” And she tried to fancy what the flame of a candle is like after the candle is blown out, for she could not remember ever having seen such a thing.", "After a while, finding that nothing more happened, she decided on going into the garden at once; but, alas for poor Alice! when she got to the door, she found she had forgotten the little golden key, and when she went back to the table for it, she found she could not possibly reach it: she could see it quite plainly through the glass, and she tried her best to climb up one of the legs of the table, but it was too slippery; and when she had tired herself out with trying, the poor little thing sat down and cried.", "“Come, there’s no use in crying like that!” said Alice to herself, rather sharply; “I advise you to leave off this minute!” She generally gave herself very good advice, (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; and once she remembered trying to box her own ears for having cheated herself in a game of croquet she was playing against herself, for this curious child was very fond of pretending to be two people. “But it’s no use now,” thought poor Alice, “to pretend to be two people! Why, there’s hardly enough of me left to make _one_ respectable person!”", "Soon her eye fell on a little glass box that was lying under the table: she opened it, and found in it a very small cake, on which the words “EAT ME” were beautifully marked in currants. “Well, I’ll eat it,” said Alice, “and if it makes me grow larger, I can reach the key; and if it makes me grow smaller, I can creep under the door; so either way I’ll get into the garden, and I don’t care which happens!”", "She ate a little bit, and said anxiously to herself, “Which way? Which way?”, holding her hand on the top of her head to feel which way it was growing, and she was quite surprised to find that she remained the same size: to be sure, this generally happens when one eats cake, but Alice had got so much into the way of expecting nothing but out-of-the-way things to happen, that it seemed quite dull and stupid for life to go on in the common way.", "So she set to work, and very soon finished off the cake."]}, {"title": "CHAPTER II. The Pool of Tears", "paragraphs": ["“Curiouser and curiouser!” cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English); “now I’m opening out like the largest telescope that ever was! Good-bye, feet!” (for when she looked down at her feet, they seemed to be almost out of sight, they were getting so far off). “Oh, my poor little feet, I wonder who will put on your shoes and stockings for you now, dears? I’m sure _I_ shan’t be able! I shall be a great deal too far off to trouble myself about you: you must manage the best way you can;—but I must be kind to them,” thought Alice, “or perhaps they won’t walk the way I want to go! Let me see: I’ll give them a new pair of boots every Christmas.”", "And she went on planning to herself how she would manage it. “They must go by the carrier,” she thought; “and how funny it’ll seem, sending presents to one’s own feet! And how odd the directions will look!", "_Alice’s Right Foot, Esq., Hearthrug, near the Fender,_ (_with Alice’s love_).", "Oh dear, what nonsense I’m talking!”", "Just then her head struck against the roof of the hall: in fact she was now more than nine feet high, and she at once took up the little golden key and hurried off to the garden door.", "Poor Alice! It was as much as she could do, lying down on one side, to look through into the garden with one eye; but to get through was more hopeless than ever: she sat down and began to cry again.", "“You ought to be ashamed of yourself,” said Alice, “a great girl like you,” (she might well say this), “to go on crying in this way! Stop this moment, I tell you!” But she went on all the same, shedding gallons of tears, until there was a large pool all round her, about four inches deep and reaching half down the hall.", "After a time she heard a little pattering of feet in the distance, and she hastily dried her eyes to see what was coming. It was the White Rabbit returning, splendidly dressed, with a pair of white kid gloves in one hand and a large fan in the other: he came trotting along in a great hurry, muttering to himself as he came, “Oh! the Duchess, the Duchess! Oh! won’t she be savage if I’ve kept her waiting!” Alice felt so desperate that she was ready to ask help of any one; so, when the Rabbit came near her, she began, in a low, timid voice, “If you please, sir—” The Rabbit started violently, dropped the white kid gloves and the fan, and skurried away into the darkness as hard as he could go.", "Alice took up the fan and gloves, and, as the hall was very hot, she kept fanning herself all the time she went on talking: “Dear, dear! How queer everything is to-day! And yesterday things went on just as usual. I wonder if I’ve been changed in the night? Let me think: was I the same when I got up this morning? I almost think I can remember feeling a little different. But if I’m not the same, the next question is, Who in the world am I? Ah, _that’s_ the great puzzle!” And she began thinking over all the children she knew that were of the same age as herself, to see if she could have been changed for any of them.", "“I’m sure I’m not Ada,” she said, “for her hair goes in such long ringlets, and mine doesn’t go in ringlets at all; and I’m sure I can’t be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, _she’s_ she, and _I’m_ I, and—oh dear, how puzzling it all is! I’ll try if I know all the things I used to know. Let me see: four times five is twelve, and four times six is thirteen, and four times seven is—oh dear! I shall never get to twenty at that rate! However, the Multiplication Table doesn’t signify: let’s try Geography. London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, _that’s_ all wrong, I’m certain! I must have been changed for Mabel! I’ll try and say ‘_How doth the little_—’” and she crossed her hands on her lap as if she were saying lessons, and began to repeat it, but her voice sounded hoarse and strange, and the words did not come the same as they used to do:—", "“How doth the little crocodile\nImprove his shining tail,\nAnd pour the waters of the Nile\nOn every golden scale!", "“How cheerfully he seems to grin,\nHow neatly spread his claws,\nAnd welcome little fishes in\nWith gently smiling jaws!”", "“I’m sure those are not the right words,” said poor Alice, and her eyes filled with tears again as she went on, “I must be Mabel after all, and I shall have to go and live in that poky little house, and have next to no toys to play with, and oh! ever so many lessons to learn! No, I’ve made up my mind about it; if I’m Mabel, I’ll stay down here! It’ll be no use their putting their heads down and saying ‘Come up again, dear!’ I shall only look up and say ‘Who am I then? Tell me that first, and then, if I like being that person, I’ll come up: if not, I’ll stay down here till I’m somebody else’—but, oh dear!” cried Alice, with a sudden burst of tears, “I do wish they _would_ put their heads down! I am so _very_ tired of being all alone here!”", "As she said this she looked down at her hands, and was surprised to see that she had put on one of the Rabbit’s little white kid gloves while she was talking. “How _can_ I have done that?” she thought. “I must be growing small again.” She got up and went to the table to measure herself by it, and found that, as nearly as she could guess, she was now about two feet high, and was going on shrinking rapidly: she soon found out that the cause of this was the fan she was holding, and she dropped it hastily, just in time to avoid shrinking away altogether.", "“That _was_ a narrow escape!” said Alice, a good deal frightened at the sudden change, but very glad to find herself still in existence; “and now for the garden!” and she ran with all speed back to the little door: but, alas! the little door was shut again, and the little golden key was lying on the glass table as before, “and things are worse than ever,” thought the poor child, “for I never was so small as this before, never! And I declare it’s too bad, that it is!”", "As she said these words her foot slipped, and in another moment, splash! she was up to her chin in salt water. Her first idea was that she had somehow fallen into the sea, “and in that case I can go back by railway,” she said to herself. (Alice had been to the seaside once in her life, and had come to the general conclusion, that wherever you go to on the English coast you find a number of bathing machines in the sea, some children digging in the sand with wooden spades, then a row of lodging houses, and behind them a railway station.) However, she soon made out that she was in the pool of tears which she had wept when she was nine feet high.", "“I wish I hadn’t cried so much!” said Alice, as she swam about, trying to find her way out. “I shall be punished for it now, I suppose, by being drowned in my own tears! That _will_ be a queer thing, to be sure! However, everything is queer to-day.”", "Just then she heard something splashing about in the pool a little way off, and she swam nearer to make out what it was: at first she thought it must be a walrus or hippopotamus, but then she remembered how small she was now, and she soon made out that it was only a mouse that had slipped in like herself.", "“Would it be of any use, now,” thought Alice, “to speak to this mouse? Everything is so out-of-the-way down here, that I should think very likely it can talk: at any rate, there’s no harm in trying.” So she began: “O Mouse, do you know the way out of this pool? I am very tired of swimming about here, O Mouse!” (Alice thought this must be the right way of speaking to a mouse: she had never done such a thing before, but she remembered having seen in her brother’s Latin Grammar, “A mouse—of a mouse—to a mouse—a mouse—O mouse!”) The Mouse looked at her rather inquisitively, and seemed to her to wink with one of its little eyes, but it said nothing.", "“Perhaps it doesn’t understand English,” thought Alice; “I daresay it’s a French mouse, come over with William the Conqueror.” (For, with all her knowledge of history, Alice had no very clear notion how long ago anything had happened.) So she began again: “Où est ma chatte?” which was the first sentence in her French lesson-book. The Mouse gave a sudden leap out of the water, and seemed to quiver all over with fright. “Oh, I beg your pardon!” cried Alice hastily, afraid that she had hurt the poor animal’s feelings. “I quite forgot you didn’t like cats.”", "“Not like cats!” cried the Mouse, in a shrill, passionate voice. “Would _you_ like cats if you were me?”", "“Well, perhaps not,” said Alice in a soothing tone: “don’t be angry about it. And yet I wish I could show you our cat Dinah: I think you’d take a fancy to cats if you could only see her. She is such a dear quiet thing,” Alice went on, half to herself, as she swam lazily about in the pool, “and she sits purring so nicely by the fire, licking her paws and washing her face—and she is such a nice soft thing to nurse—and she’s such a capital one for catching mice—oh, I beg your pardon!” cried Alice again, for this time the Mouse was bristling all over, and she felt certain it must be really offended. “We won’t talk about her any more if you’d rather not.”", "“We indeed!” cried the Mouse, who was trembling down to the end of his tail. “As if _I_ would talk on such a subject! Our family always _hated_ cats: nasty, low, vulgar things! Don’t let me hear the name again!”", "“I won’t indeed!” said Alice, in a great hurry to change the subject of conversation. “Are you—are you fond—of—of dogs?” The Mouse did not answer, so Alice went on eagerly: “There is such a nice little dog near our house I should like to show you! A little bright-eyed terrier, you know, with oh, such long curly brown hair! And it’ll fetch things when you throw them, and it’ll sit up and beg for its dinner, and all sorts of things—I can’t remember half of them—and it belongs to a farmer, you know, and he says it’s so useful, it’s worth a hundred pounds! He says it kills all the rats and—oh dear!” cried Alice in a sorrowful tone, “I’m afraid I’ve offended it again!” For the Mouse was swimming away from her as hard as it could go, and making quite a commotion in the pool as it went.", "So she called softly after it, “Mouse dear! Do come back again, and we won’t talk about cats or dogs either, if you don’t like them!” When the Mouse heard this, it turned round and swam slowly back to her: its face was quite pale (with passion, Alice thought), and it said in a low trembling voice, “Let us get to the shore, and then I’ll tell you my history, and you’ll understand why it is I hate cats and dogs.”", "It was high time to go, for the pool was getting quite crowded with the birds and animals that had fallen into it: there were a Duck and a Dodo, a Lory and an Eaglet, and several other curious creatures. Alice led the way, and the whole party swam to the shore."]}, {"title": "CHAPTER III. A Caucus-Race and a Long Tale", "paragraphs": ["They were indeed a queer-looking party that assembled on the bank—the birds with draggled feathers, the animals with their fur clinging close to them, and all dripping wet, cross, and uncomfortable.", "The first question of course was, how to get dry again: they had a consultation about this, and after a few minutes it seemed quite natural to Alice to find herself talking familiarly with them, as if she had known them all her life. Indeed, she had quite a long argument with the Lory, who at last turned sulky, and would only say, “I am older than you, and must know better;” and this Alice would not allow without knowing how old it was, and, as the Lory positively refused to tell its age, there was no more to be said.", "At last the Mouse, who seemed to be a person of authority among them, called out, “Sit down, all of you, and listen to me! _I’ll_ soon make you dry enough!” They all sat down at once, in a large ring, with the Mouse in the middle. Alice kept her eyes anxiously fixed on it, for she felt sure she would catch a bad cold if she did not get dry very soon.", "“Ahem!” said the Mouse with an important air, “are you all ready? This is the driest thing I know. Silence all round, if you please! ‘William the Conqueror, whose cause was favoured by the pope, was soon submitted to by the English, who wanted leaders, and had been of late much accustomed to usurpation and conquest. Edwin and Morcar, the earls of Mercia and Northumbria—’”", "“Ugh!” said the Lory, with a shiver.", "“I beg your pardon!” said the Mouse, frowning, but very politely: “Did you speak?”", "“Not I!” said the Lory hastily.", "“I thought you did,” said the Mouse. “—I proceed. ‘Edwin and Morcar, the earls of Mercia and Northumbria, declared for him: and even Stigand, the patriotic archbishop of Canterbury, found it advisable—’”", "“Found _what_?” said the Duck.", "“Found _it_,” the Mouse replied rather crossly: “of course you know what ‘it’ means.”", "“I know what ‘it’ means well enough, when _I_ find a thing,” said the Duck: “it’s generally a frog or a worm. The question is, what did the archbishop find?”", "The Mouse did not notice this question, but hurriedly went on, “‘—found it advisable to go with Edgar Atheling to meet William and offer him the crown. William’s conduct at first was moderate. But the insolence of his Normans—’ How are you getting on now, my dear?” it continued, turning to Alice as it spoke.", "“As wet as ever,” said Alice in a melancholy tone: “it doesn’t seem to dry me at all.”", "“In that case,” said the Dodo solemnly, rising to its feet, “I move that the meeting adjourn, for the immediate adoption of more energetic remedies—”", "“Speak English!” said the Eaglet. “I don’t know the meaning of half those long words, and, what’s more, I don’t believe you do either!” And the Eaglet bent down its head to hide a smile: some of the other birds tittered audibly.", "“What I was going to say,” said the Dodo in an offended tone, “was, that the best thing to get us dry would be a Caucus-race.”", "“What _is_ a Caucus-race?” said Alice; not that she wanted much to know, but the Dodo had paused as if it thought that _somebody_ ought to speak, and no one else seemed inclined to say anything.", "“Why,” said the Dodo, “the best way to explain it is to do it.” (And, as you might like to try the thing yourself, some winter day, I will tell you how the Dodo managed it.)", "First it marked out a race-course, in a sort of circle, (“the exact shape doesn’t matter,” it said,) and then all the party were placed along the course, here and there. There was no “One, two, three, and away,” but they began running when they liked, and left off when they liked, so that it was not easy to know when the race was over. However, when they had been running half an hour or so, and were quite dry again, the Dodo suddenly called out “The race is over!” and they all crowded round it, panting, and asking, “But who has won?”", "This question the Dodo could not answer without a great deal of thought, and it sat for a long time with one finger pressed upon its forehead (the position in which you usually see Shakespeare, in the pictures of him), while the rest waited in silence. At last the Dodo said, “_Everybody_ has won, and all must have prizes.”", "“But who is to give the prizes?” quite a chorus of voices asked.", "“Why, _she_, of course,” said the Dodo, pointing to Alice with one finger; and the whole party at once crowded round her, calling out in a confused way, “Prizes! Prizes!”", "Alice had no idea what to do, and in despair she put her hand in her pocket, and pulled out a box of comfits, (luckily the salt water had not got into it), and handed them round as prizes. There was exactly one a-piece, all round.", "“But she must have a prize herself, you know,” said the Mouse.", "“Of course,” the Dodo replied very gravely. “What else have you got in your pocket?” he went on, turning to Alice.", "“Only a thimble,” said Alice sadly.", "“Hand it over here,” said the Dodo.", "Then they all crowded round her once more, while the Dodo solemnly presented the thimble, saying “We beg your acceptance of this elegant thimble;” and, when it had finished this short speech, they all cheered.", "Alice thought the whole thing very absurd, but they all looked so grave that she did not dare to laugh; and, as she could not think of anything to say, she simply bowed, and took the thimble, looking as solemn as she could.", "The next thing was to eat the comfits: this caused some noise and confusion, as the large birds complained that they could not taste theirs, and the small ones choked and had to be patted on the back. However, it was over at last, and they sat down again in a ring, and begged the Mouse to tell them something more.", "“You promised to tell me your history, you know,” said Alice, “and why it is you hate—C and D,” she added in a whisper, half afraid that it would be offended again.", "“Mine is a long and a sad tale!” said the Mouse, turning to Alice, and sighing.", "“It _is_ a long tail, certainly,” said Alice, looking down with wonder at the Mouse’s tail; “but why do you call it sad?” And she kept on puzzling about it while the Mouse was speaking, so that her idea of the tale was something like this:—", "“Fury said to a mouse, That he met in the house, ‘Let us both\ngo to law: _I_ will prosecute _you_.—Come, I’ll take no\ndenial; We must have a trial: For really this morning I’ve\nnothing to do.’ Said the mouse to the cur, ‘Such a trial, dear\nsir, With no jury or judge, would be wasting our breath.’\n‘I’ll be judge, I’ll be jury,’ Said cunning old Fury: ‘I’ll\ntry the whole cause, and condemn you to death.’”", "“You are not attending!” said the Mouse to Alice severely. “What are you thinking of?”", "“I beg your pardon,” said Alice very humbly: “you had got to the fifth bend, I think?”", "“I had _not!_” cried the Mouse, sharply and very angrily.", "“A knot!” said Alice, always ready to make herself useful, and looking anxiously about her. “Oh, do let me help to undo it!”", "“I shall do nothing of the sort,” said the Mouse, getting up and walking away. “You insult me by talking such nonsense!”", "“I didn’t mean it!” pleaded poor Alice. “But you’re so easily offended, you know!”", "The Mouse only growled in reply.", "“Please come back and finish your story!” Alice called after it; and the others all joined in chorus, “Yes, please do!” but the Mouse only shook its head impatiently, and walked a little quicker.", "“What a pity it wouldn’t stay
