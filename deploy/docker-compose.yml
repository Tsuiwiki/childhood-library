# Childhood Library - base Compose skeleton
#
# STATUS: source skeleton only. NOT enabled on the remote VM yet (see docs/REMOTE_DEVELOPMENT_ENVIRONMENT.md).
# Only PostgreSQL is defined here; api / web / nginx are added after T-05 and T-08.
#
# SECURITY: every internal port is bound to 127.0.0.1. The VM has firewalld inactive,
# so a 0.0.0.0 binding would be reachable from the public network. Never expose
# the database port or admin tools publicly.
#
# OVERLAY CONTRACT (important):
#   This base MUST be used together with one environment overlay. It deliberately
#   does NOT declare `ports`, `volumes` or `POSTGRES_DB`.
#   Compose APPENDS sequence fields (ports, volumes) when merging files; declaring
#   them here as well would produce a duplicate host-port binding and two volumes
#   mounted on /var/lib/postgresql/data. All per-environment values live in
#   compose.dev.yml / compose.test.yml.
# ALWAYS invoke with `docker compose --project-directory . ...` so Compose loads
# the repo-root .env (v2 defaults to the first -f file's directory, i.e. deploy/)
# and resolves ./var/media against the repo root.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # `$$` escapes Compose interpolation so the CONTAINER's own environment is
    # expanded at runtime. This keeps the check correct whichever overlay set
    # POSTGRES_DB, instead of freezing a value from the host .env.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Use an explicit project name per environment:
#   development: -p cl-dev  + deploy/compose.dev.yml
#   testing:     -p cl-test + deploy/compose.test.yml
# Two environments must never share a database, volume or backup target.
